  const mobEntry = selectedMob !== null ? (d.mob_list || []).find(m => m.id === selectedMob) : null;
  const hasRealElapsed = !mobEntry || (mobEntry.first_ts && mobEntry.last_ts && mobEntry.last_ts > mobEntry.first_ts);

  let rows = '';
  const selEncEntry = selectedEnc !== null ? (d.encounters || []).find(e => e.key === selectedEnc) : null;
  if (selEncEntry) {
    // Encounter scope: merge member-mob stats per player; rates over the
    // pull's own duration.
    const mergeMembers = (map, totalField, byFields) => {
      const acc = {};
      for (const id of selEncEntry.members) {
        for (const e of (map || {})[String(id)] || []) {
          const a = acc[e.name] || (acc[e.name] = { name: e.name, classes: e.classes, total: 0 });
          a.total += e[totalField] || 0;
        }
      }
      return Object.values(acc).sort((a, b) => b.total - a.total);
    };
    const encSecs = Math.max(selEncEntry.end_ts - selEncEntry.start_ts, 1);
    if (detailMode === 'damage' || detailMode === 'tanked') {
      const list = mergeMembers(detailMode === 'damage' ? d.mob_damage : d.mob_tanking, 'total_damage');
      const tot = list.reduce((s, e) => s + e.total, 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total, Math.round(e.total / encSecs), 'DPS', tot > 0 ? e.total / tot * 100 : null)).join('');
    } else if (detailMode === 'healing' || detailMode === 'healed') {
      const list = mergeMembers(detailMode === 'healing' ? d.mob_healing : d.mob_healed,
        detailMode === 'healing' ? 'total_heals' : 'total_healed_received');
      const tot = list.reduce((s, e) => s + e.total, 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total, Math.round(e.total / encSecs), 'HPS', tot > 0 ? e.total / tot * 100 : null)).join('');
    } else {
      const list = mergeMembers(d.mob_avoid, 'total');
      rows = list.map(e => sumRow(e.name, e.classes, e.total, '', '')).join('');
    }
    rowsEl.innerHTML = sumHdr(detailMode) + rows;
    return;
  }
  if (selectedMob !== null) {
    const key = String(selectedMob);
    if (detailMode === 'damage') {
      const list = (d.mob_damage  || {})[key] || [];
      const tot  = list.reduce((s, e) => s + (e.total_damage || 0), 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total_damage, hasRealElapsed ? e.dps : null, 'DPS', tot > 0 ? e.total_damage / tot * 100 : null)).join('');
    } else if (detailMode === 'tanked') {
      const list = (d.mob_tanking || {})[key] || [];
      const tot  = list.reduce((s, e) => s + (e.total_damage || 0), 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total_damage, hasRealElapsed ? e.dps : null, 'DPS', tot > 0 ? e.total_damage / tot * 100 : null)).join('');
    } else if (detailMode === 'healing') {
      const list = (d.mob_healing || {})[key] || [];
      const tot  = list.reduce((s, e) => s + (e.total_heals || 0), 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total_heals, hasRealElapsed ? e.hps : null, 'HPS', tot > 0 ? e.total_heals / tot * 100 : null)).join('');
    } else if (detailMode === 'healed') {
      const list = (d.mob_healed  || {})[key] || [];
      const tot  = list.reduce((s, e) => s + (e.total_healed_received || 0), 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total_healed_received, hasRealElapsed ? e.hps : null, 'HPS', tot > 0 ? e.total_healed_received / tot * 100 : null)).join('');
    } else {
      rows = ((d.mob_avoid || {})[key] || []).map(e => sumRow(e.name, e.classes, e.total, '', '')).join('');
    }
  } else {
    if (detailMode === 'damage') {
      const list = d.entities || [];
      const tot  = list.reduce((s, e) => s + (e.total_damage || 0), 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total_damage, Math.round(e.total_damage/elapsed), 'DPS', tot > 0 ? e.total_damage / tot * 100 : null)).join('');
    } else if (detailMode === 'healing') {
      const list = d.healers || [];
      const tot  = list.reduce((s, e) => s + (e.total_heals || 0), 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total_heals, e.hps, 'HPS', tot > 0 ? e.total_heals / tot * 100 : null)).join('');
    } else if (detailMode === 'healed') {
      const list = d.healees || [];
      const tot  = list.reduce((s, e) => s + (e.total_healed_received || 0), 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total_healed_received, e.hps, 'HPS', tot > 0 ? e.total_healed_received / tot * 100 : null)).join('');
    } else if (detailMode === 'tanked') {
      const list = d.tanked || [];
      const tot  = list.reduce((s, e) => s + (e.total_damage || 0), 0);
      rows = list.map(e => sumRow(e.name, e.classes, e.total_damage, e.dps, 'DPS', tot > 0 ? e.total_damage / tot * 100 : null)).join('');
    } else {
      rows = (d.avoidance || []).map(e => sumRow(e.name, e.classes, e.total, '', '')).join('');
    }
  }
  rowsEl.innerHTML = sumHdr(detailMode) + rows;
}

/// Column headers matching sumRow's grid tracks, labeled per data tab.
function sumHdr(mode) {
  const labels = {
    damage:  ['Damage', 'DPS'],
    tanked:  ['Tanked', 'DPS'],
    healing: ['Heals',  'HPS'],
    healed:  ['Healed', 'HPS'],
    avoid:   ['Count',  ''],
  }[mode] || ['', ''];
  return `<div class="sum-hdr">
    <span class="h-name">Player</span>
    <span>Class</span>
    <span>${labels[0]}</span>
    <span>%</span>
    <span>${labels[1]}</span>
  </div>`;
}

function sumRow(name, classes, val, rate, rateLabel, pct) {
  const clsArr = Array.isArray(classes) ? classes : (classes ? [classes] : []);
  // The unit lives in the column header now — cells carry just the number.
  const rateStr = (rate === null || rate === undefined || rateLabel === '') ? (rateLabel === '' ? '' : '—') : `${fmtK(rate)}`;
  const pctStr  = (pct != null) ? pct.toFixed(1)+'%' : '';
  return `<div class="sum-row">
    <span class="sum-name">${name}</span>
    <span class="sum-class">${classCodesHtml(clsArr)}</span>
    <span class="sum-val">${fmtK(val)}</span>
    <span class="sum-pct">${pctStr}</span>
    <span class="sum-rate">${rateStr}</span>
  </div>`;
}

/// Merge per-mob card entries across an encounter's members: totals summed per
/// player, breakdown lists (by type / by spell) summed by key. Rates are NOT
/// carried over — cards recompute them from the pull's own elapsed time.
function mergeEncounterEntries(map, members, totalField, lists) {
  const acc = {};
  for (const id of members) {
    for (const e of (map || {})[String(id)] || []) {
      const a = acc[e.name] || (acc[e.name] = {
        name: e.name, class: e.class, classes: e.classes, level: e.level,
        [totalField]: 0, _lists: {},
      });
      a[totalField] += e[totalField] || 0;
      for (const [listName, [k, v]] of Object.entries(lists)) {
        const m = a._lists[listName] || (a._lists[listName] = {});
        for (const r of e[listName] || []) m[r[k]] = (m[r[k]] || 0) + (r[v] || 0);
      }
    }
  }
  return Object.values(acc).map(a => {
    for (const [listName, [k, v]] of Object.entries(lists)) {
      a[listName] = Object.entries(a._lists[listName] || {})
        .sort((x, y) => y[1] - x[1])
        .map(([kk, vv]) => ({ [k]: kk, [v]: vv }));
    }
    delete a._lists;
    return a;
  }).sort((x, y) => (y[totalField] || 0) - (x[totalField] || 0));
}

function renderCards(d) {
  const cardsEl = document.getElementById('cards');
  if (detailMode === 'loot') { cardsEl.innerHTML = ''; return; }

  // Use null elapsed to suppress per-second rates when mob has only been seen
  // within a single log-second (rates would be meaningless at that resolution).
  const mobEntry = selectedMob !== null ? (d.mob_list || []).find(m => m.id === selectedMob) : null;
  const hasRealElapsed = !mobEntry || (mobEntry.first_ts && mobEntry.last_ts && mobEntry.last_ts > mobEntry.first_ts);
  const elapsed = hasRealElapsed ? Math.max(d.fight_elapsed_secs, 1) : null;

  // Pull selected: cards cover the encounter — same scope as the header and
  // summary, so every number on screen agrees.
  const encEntry = selectedEnc !== null ? (d.encounters || []).find(e => e.key === selectedEnc) : null;
  if (encEntry) {
    const ids = encEntry.members;
    if (detailMode === 'damage' || detailMode === 'tanked') {
      const p = mergeEncounterEntries(
        detailMode === 'damage' ? d.mob_damage : d.mob_tanking, ids,
        'total_damage', { damage_by_type: ['type', 'damage'], spells: ['spell', 'damage'] });
      cardsEl.innerHTML = p.length ? p.map(e => damageCard(e, elapsed)).join('')
        : '<div class="empty-state">No data recorded for this pull</div>';
    } else if (detailMode === 'healing') {
      const h = mergeEncounterEntries(d.mob_healing, ids,
        'total_heals', { heals_by_spell: ['spell', 'healed'] });
      cardsEl.innerHTML = h.length ? h.map(e => healerCard(e, elapsed)).join('')
        : '<div class="empty-state">No healing recorded for this pull</div>';
    } else if (detailMode === 'healed') {
      const h = mergeEncounterEntries(d.mob_healed, ids,
        'total_healed_received', { healed_received_by_spell: ['spell', 'healed'] });
      cardsEl.innerHTML = h.length ? h.map(e => healeeCard(e, elapsed)).join('')
        : '<div class="empty-state">No heals received recorded for this pull</div>';
    } else {
      const a = mergeEncounterEntries(d.mob_avoid, ids,
        'total', { by_type: ['type', 'count'] });
      cardsEl.innerHTML = a.length ? a.map(e => avoidCard(e)).join('')
        : '<div class="empty-state">No avoidance recorded for this pull</div>';
    }
    return;
  }

  if (selectedMob !== null) {
    const key = String(selectedMob);
    if      (detailMode === 'damage')  { const p = (d.mob_damage  || {})[key] || []; cardsEl.innerHTML = p.length ? p.map(e => damageCard(e, elapsed)).join('') : '<div class="empty-state">No damage recorded for this mob yet</div>'; }
    else if (detailMode === 'tanked')  { const p = (d.mob_tanking || {})[key] || []; cardsEl.innerHTML = p.length ? p.map(e => damageCard(e, elapsed)).join('') : '<div class="empty-state">No tanking data recorded for this mob</div>'; }
    else if (detailMode === 'healing') { const h = (d.mob_healing || {})[key] || []; cardsEl.innerHTML = h.length ? h.map(e => healerCard(e, elapsed)).join('') : '<div class="empty-state">No healing recorded for this mob</div>'; }
    else if (detailMode === 'healed')  { const h = (d.mob_healed  || {})[key] || []; cardsEl.innerHTML = h.length ? h.map(e => healeeCard(e, elapsed)).join('') : '<div class="empty-state">No heals received recorded for this mob</div>'; }
    else                               { const a = (d.mob_avoid   || {})[key] || []; cardsEl.innerHTML = a.length ? a.map(e => avoidCard(e)).join('') : '<div class="empty-state">No avoidance recorded for this mob</div>'; }
  } else {
    if      (detailMode === 'damage')  { const e = d.entities  || []; cardsEl.innerHTML = e.length ? e.map(x => damageCard(x, elapsed)).join('') : '<div class="waiting-state">Waiting for combat…</div>'; }
    else if (detailMode === 'healing') { const h = d.healers   || []; cardsEl.innerHTML = h.length ? h.map(e => healerCard(e, elapsed)).join('') : '<div class="empty-state">No healing recorded</div>'; }
    else if (detailMode === 'healed')  { const h = d.healees   || []; cardsEl.innerHTML = h.length ? h.map(e => healeeCard(e, elapsed)).join('') : '<div class="empty-state">No heals received recorded</div>'; }
    else if (detailMode === 'tanked')  { const t = d.tanked    || []; cardsEl.innerHTML = t.length ? t.map(e => damageCard(e, elapsed)).join('') : '<div class="empty-state">No tanking recorded</div>'; }
    else                               { const a = d.avoidance || []; cardsEl.innerHTML = a.length ? a.map(e => avoidCard(e)).join('') : '<div class="empty-state">No avoidance recorded</div>'; }
  }
}

function castBarHtml(playerName) {
  const cast = S.casts[playerName];
  if (!cast || S.lastTs - cast.logTs > 10) return '';
  return `<div class="cast-bar"><div class="cast-bar-shimmer"></div><span class="cast-bar-text">✦ ${cast.spell}</span></div>`;
}

function damageCard(e, elapsed, barColor = null) {
  const classes = e.classes || (e.class ? [e.class] : []);
  const hdrStyle = barColor ? `background:${barColor}` : classHeaderStyle(classes);
  const bc = barColor || classColor(classes[0] || '');
  const byType = e.damage_by_type || [];
  const spells = e.spells || [];
  const total  = e.total_damage;
  const typeRows  = byType.map(r => typeRow(r.type, r.damage, total, bc, elapsed)).join('');
  const spellRows = spells.length ? `<hr class="spell-sep">` + spells.map(r => typeRow(truncate(r.spell, 17), r.damage, total, '#3c64a0', elapsed)).join('') : '';
  const clsHtml = classCodesHtml(classes);
  const lvlHtml = isPetName(e.name) ? '<span class="pet">Pet</span>' : (e.level ? `<span class="lvl">${e.level}</span>` : '');
  return `<div class="card"><div class="card-hdr" style="${hdrStyle}"><span>${e.name}</span>${clsHtml ? `<span class="cls">– ${clsHtml}</span>` : ''}${lvlHtml}</div>${castBarHtml(e.name)}<div class="card-col-hdr"><span class="c-type">Type</span><span class="c-val">Damage</span><span class="c-rate">DPS</span></div>${typeRows}${spellRows}<div class="card-pad"></div></div>`;
}

function healerCard(e, elapsed) {
  const classes = e.classes || (e.class ? [e.class] : []);
  const hdrStyle = classHeaderStyle(classes);
  const healColor = '#28a064';
  const total  = e.total_heals;
  const spells = e.heals_by_spell || [];
  const spellRows = (!spells.length && total > 0) ? typeRow('heal', total, total, healColor, elapsed, true) : spells.map(r => typeRow(truncate(r.spell, 17), r.healed, total, healColor, elapsed, true)).join('');
  const clsHtml = classCodesHtml(classes);
  const lvlHtml = isPetName(e.name) ? '<span class="pet">Pet</span>' : (e.level ? `<span class="lvl">${e.level}</span>` : '');
  return `<div class="card"><div class="card-hdr" style="${hdrStyle}"><span>${e.name}</span>${clsHtml ? `<span class="cls">– ${clsHtml}</span>` : ''}${lvlHtml}</div>${castBarHtml(e.name)}<div class="card-col-hdr"><span class="c-type">Spell</span><span class="c-val">Healed</span><span class="c-rate">HPS</span></div>${spellRows}<div class="card-pad"></div></div>`;
}

function healeeCard(e, elapsed) {
  const classes = e.classes || (e.class ? [e.class] : []);
  const hdrStyle = classHeaderStyle(classes);
  const healColor = '#2080c0';
  const total  = e.total_healed_received;
  const spells = e.healed_received_by_spell || [];
  const spellRows = (!spells.length && total > 0) ? typeRow('heal', total, total, healColor, elapsed, true) : spells.map(r => typeRow(truncate(r.spell, 17), r.healed, total, healColor, elapsed, true)).join('');
  const clsHtml = classCodesHtml(classes);
  const lvlHtml = isPetName(e.name) ? '<span class="pet">Pet</span>' : (e.level ? `<span class="lvl">${e.level}</span>` : '');
  return `<div class="card"><div class="card-hdr" style="${hdrStyle}"><span>${e.name}</span>${clsHtml ? `<span class="cls">– ${clsHtml}</span>` : ''}${lvlHtml}</div>${castBarHtml(e.name)}<div class="card-col-hdr"><span class="c-type">Spell</span><span class="c-val">Healed</span><span class="c-rate">HPS</span></div>${spellRows}<div class="card-pad"></div></div>`;
}

function avoidCard(e) {
  const classes = e.classes || (e.class ? [e.class] : []);
  const hdrStyle = classHeaderStyle(classes);
  const total = e.total;
  const rows = (e.by_type || []).map(r => {
    const pct = total > 0 ? (r.count / total * 100).toFixed(1) : '0.0';
    return `<div class="type-row"><span class="c-type"><span class="type-bar" style="width:${pct}%;background:#2a6a8a"></span><span class="type-label">${r.type}</span></span><span class="c-val">${r.count}</span><span class="c-rate">${pct}%</span></div>`;
  }).join('');
  const clsHtml = classCodesHtml(classes);
  const lvlHtml = isPetName(e.name) ? '<span class="pet">Pet</span>' : (e.level ? `<span class="lvl">${e.level}</span>` : '');
  return `<div class="card"><div class="card-hdr" style="${hdrStyle}"><span>${e.name}</span>${clsHtml ? `<span class="cls">– ${clsHtml}</span>` : ''}${lvlHtml}</div><div class="card-col-hdr"><span class="c-type">Type</span><span class="c-val">Count</span><span class="c-rate">%</span></div>${rows}<div class="card-pad"></div></div>`;
}

function typeRow(label, dmg, total, barColor, elapsed, isHeal = false) {
  const pct = total > 0 ? (dmg / total * 100).toFixed(1) : 0;
  const rl  = elapsed != null
    ? (isHeal ? `${Math.round(dmg / elapsed)} HPS` : `${Math.round(dmg / elapsed)} DPS`)
    : '—';
  return `<div class="type-row"><span class="c-type"><span class="type-bar" style="width:${pct}%;background:${barColor}"></span><span class="type-label">${label}</span></span><span class="c-val">${fmtK(dmg)}</span><span class="c-rate">${rl}</span></div>`;
}

// ── Graph ─────────────────────────────────────────────────────────────────────
const GRAPH_BUCKET = 5; // seconds per bin
const GRAPH_MAX_PLAYERS = 8;
const GRAPH_COLORS = [
  '#5a9aff', '#ff6b6b', '#4dca80', '#ffa733',
  '#c878e8', '#40c8c8', '#f0d040', '#ff7eb3',
];

function toggleGraph() {
  graphVisible = !graphVisible;
  const strip = document.getElementById('graph-strip');
  const btn   = document.getElementById('graph-toggle');
  strip.style.display = graphVisible ? 'flex' : 'none';
  btn.textContent = graphVisible ? '▲ Graph' : '▼ Graph';
  btn.classList.toggle('active', graphVisible);
  if (graphVisible) {
    destroyChart();
    renderGraph();
  } else {
    destroyChart();
  }
}

function destroyChart() {
  if (chartInst)     { chartInst.destroy();     chartInst     = null; }
  if (chartInstRate) { chartInstRate.destroy();  chartInstRate = null; }
}

function renderGraph() {
  const canvas     = document.getElementById('graph-canvas');
  const canvasRate = document.getElementById('graph-canvas-rate');
  if (!canvas || !canvasRate) return;

  if (selectedMob === null && selectedEnc === null) { destroyChart(); return; }

  const tlMap = {
    damage: S.mobDmgTL, tanked: S.mobTankTL, healing: S.mobHealTL,
    healed: S.mobHealedTL, avoid: S.mobAvoidTL,
  }[detailMode];
  const yl = {
    damage:  ['Total Damage',   'DPS'],
    tanked:  ['Total Incoming', 'Incoming DPS'],
    healing: ['Total Healing',  'HPS'],
    healed:  ['Total Healed',   'HPS Received'],
    avoid:   ['Total Avoids',   'Avoids / 5s'],
  }[detailMode];
  if (!tlMap || !yl) { destroyChart(); return; }
  const [yLabelTotal, yLabelRate] = yl;

  let tl, fightStart, fightEnd;
  const encG = selectedEnc !== null && lastData
    ? (lastData.encounters || []).find(e => e.key === selectedEnc) : null;
  if (encG) {
    // Pull selected: merge member-mob timelines per player over the pull window.
    tl = {};
    for (const id of encG.members) {
      const m = tlMap[id];
      if (!m) continue;
      for (const [name, evs] of Object.entries(m)) {
        (tl[name] = tl[name] || []).push(...evs);
      }
    }
    for (const evs of Object.values(tl)) evs.sort((a, b) => a.ts - b.ts);
    fightStart = encG.start_ts;
    fightEnd   = Math.max(encG.end_ts, encG.start_ts + 1);
  } else {
    const mobInfo = S.mobs[selectedMob];
    if (!mobInfo) { destroyChart(); return; }
    tl = tlMap[selectedMob];
    fightStart = mobInfo.firstTs;
    fightEnd   = mobInfo.lastTs;
  }

  if (!tl || Object.keys(tl).length === 0) { destroyChart(); return; }
  const numBuckets = Math.max(1, Math.ceil((fightEnd - fightStart) / GRAPH_BUCKET));

  const players = Object.entries(tl)
    .map(([name, evs]) => ({ name, evs, total: evs.reduce((s, e) => s + e.v, 0) }))
    .sort((a, b) => b.total - a.total)
    .slice(0, GRAPH_MAX_PLAYERS);

  const labels = Array.from({length: numBuckets}, (_, i) => `${i * GRAPH_BUCKET}s`);

  // Build buckets once per player, derive both chart series from them
  const playerBuckets = players.map(({ name, evs }, idx) => {
    const buckets = new Array(numBuckets).fill(0);
    for (const e of evs) {
      const bi = Math.min(Math.floor((e.ts - fightStart) / GRAPH_BUCKET), numBuckets - 1);
      if (bi >= 0) buckets[bi] += e.v;
    }
    return { name, buckets, color: GRAPH_COLORS[idx % GRAPH_COLORS.length] };
  });

  const datasetsTotal = playerBuckets.map(({ name, buckets, color }) => {
    let running = 0;
    const data = buckets.map(v => { running += v; return running; });
    return { label: name, data, borderColor: color, backgroundColor: color + '30', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false };
  });

  const datasetsRate = playerBuckets.map(({ name, buckets, color }) => {
    const data = buckets.map(v => Math.round(v / GRAPH_BUCKET));
    return { label: name, data, borderColor: color, backgroundColor: color + '30', borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false };
  });

  function makeOpts(yLabel, showLegend) {
    return {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: {
          display: showLegend,
          position: 'right',
          labels: { color: '#999', font: { size: 10, family: 'monospace' }, boxWidth: 10, padding: 5 },
        },
        tooltip: { mode: 'index', intersect: false },
      },
      scales: {
        x: {
          grid: { color: '#252525' },
          ticks: { color: '#555', font: { size: 9, family: 'monospace' }, maxTicksLimit: 12 },
        },
        y: {
          grid: { color: '#252525' },
          ticks: { color: '#777', font: { size: 9, family: 'monospace' }, callback: v => fmtK(v) },
          title: { display: true, text: yLabel, color: '#555', font: { size: 9 } },
          min: 0,
        },
      },
    };
  }

  if (chartInst) {
    chartInst.data.labels   = labels;
    chartInst.data.datasets = datasetsTotal;
    chartInst.options.scales.y.title.text = yLabelTotal;
    chartInst.update('none');
  } else {
    chartInst = new Chart(canvas, { type: 'line', data: { labels, datasets: datasetsTotal }, options: makeOpts(yLabelTotal, false) });
  }

  if (chartInstRate) {
    chartInstRate.data.labels   = labels;
    chartInstRate.data.datasets = datasetsRate;
    chartInstRate.options.scales.y.title.text = yLabelRate;
    chartInstRate.update('none');
  } else {
    chartInstRate = new Chart(canvasRate, { type: 'line', data: { labels, datasets: datasetsRate }, options: makeOpts(yLabelRate, true) });
  }
}

// ── WebSocket connection ───────────────────────────────────────────────────────
let ws, wsTimer;

// Timeline state
let tlFirstTs  = null;  // wall-clock unix seconds (used for seek)
let tlLastTs   = null;  // wall-clock unix seconds (used for seek)
let tlIsLive   = true;  // currently following live
let tlPaused   = false; // paused during replay
let tlCanGoLive = true; // false for completed recordings with no live ingest
let logFirstTs = null;  // EQ log-event unix seconds (used for labels)
let logLastTs  = null;  // EQ log-event unix seconds (used for labels)
let sessionPreloading = false; // true while initial session cache preload is in flight

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const url   = `${proto}://${location.host}${WS_PATH}`;
  ws = new WebSocket(url);
  ws.onopen    = () => { setStatus('live', '● live'); tlIsLive = true; tlPaused = false; updateLiveBtn(); updatePlayPauseBtn(); };
  ws.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch(_) { return; }

    if (msg.t === 'info') {
      // Server tells us the full timeline bounds.
      tlFirstTs  = msg.first_ts  || null;
      tlLastTs   = msg.last_ts   || null;
      // Use log-event timestamps for display and seeking when provided.
      // These span the actual EQ session even if the wall-clock window is
      // near-zero (e.g. a dump-mode replay that finished in under a second).
      if (msg.log_first_ts) logFirstTs = msg.log_first_ts;
      if (msg.log_last_ts)  logLastTs  = msg.log_last_ts;
      // If no ingest client is connected this is a completed recording,
      // not a live stream — update status accordingly.
      if (!msg.is_live) {
        tlIsLive = false;
        tlCanGoLive = false;
        setStatus('poll', '◉ recorded');
        updateLiveBtn();
        updatePlayPauseBtn();
        updateWallClock();
      }
      // If the page was loaded with ?session=N, constrain the timeline to
      // [session_start, session_end] and preload the full session into cache.
      if (SESSION_LOG_TS > 0) {
        logFirstTs = SESSION_LOG_TS;
        if (SESSION_END_LOG_TS > 0) logLastTs = SESSION_END_LOG_TS;
        // For the latest session (SESSION_END_LOG_TS = 0) logLastTs keeps the
        // journal end from msg.log_last_ts, which is the correct session end.
        cachedBatches.length = 0;
        cacheComplete = false;
        sessionPreloading = false;
        resetState();
        tlIsLive = false;
        tlPaused = true;
        updateLiveBtn();
        updatePlayPauseBtn();
        // Seek to the end of the session so the full session loads into cache.
        // For non-last sessions use SESSION_END_LOG_TS; for the latest session
        // use the journal end (msg.log_last_ts).  snap-back to SESSION_LOG_TS
        // fires once preloading completes (batch past end / stream_done / now_live).
        const preloadEndTs = SESSION_END_LOG_TS > 0 ? SESSION_END_LOG_TS
                           : (msg.log_last_ts || null);
        if (preloadEndTs && preloadEndTs > SESSION_LOG_TS) {
          sessionPreloading = true;
          document.getElementById('cards').innerHTML = '<div class="waiting-state">Loading data…</div>';
          sendWS({ t: 'seek_full_paused_log', to_log_ts: preloadEndTs });
        } else {
          // Empty session or no end known — park at session start.
          sendWS({ t: 'seek_full_paused_log', to_log_ts: SESSION_LOG_TS });
        }
      }
      updateTimelineBar();
      return;
    }
    if (msg.t === 'seek_ok') {
      tlFirstTs = msg.first_ts || tlFirstTs;
      tlLastTs  = msg.last_ts  || tlLastTs;
      updateTimelineBar();
      return;
    }
    if (msg.t === 'catch_up_done') {
      // Server finished delivering all batches up to the preload target.
      cacheComplete = true;
      if (sessionPreloading) {
        tlPaused = true;
        tlIsLive = false;
        updatePlayPauseBtn();
        snapSessionToStart();
      }
      return;
    }
    if (msg.t === 'stream_done') {
      cacheComplete = true;
      if (sessionPreloading) {
        // Preload complete (completed recording) — show full session state at end.
        tlPaused = true;
        tlIsLive = false;
        updatePlayPauseBtn();
        snapSessionToStart();
        return;
      }
      tlPaused = true;
      tlIsLive = false;
      S.casts = {};
      updatePlayPauseBtn();
      scheduleRender();
      return;
    }
    if (msg.t === 'now_live') {
      cacheComplete = true;
      if (sessionPreloading) {
        // Preload caught up to live edge — show full session state and go live.
        tlPaused = true;
        tlIsLive = false;
        updateLiveBtn();
        updatePlayPauseBtn();
        snapSessionToStart();
        return;
      }
      tlIsLive = true;
      tlPaused = false;
      liveAutoSelect = true;
      document.getElementById('tl-speed').value = '1';
      updateLiveBtn();
      updatePlayPauseBtn();
      setScrubberToEnd();
      return;
    }
    if (msg.t === 'batch') {
      try {
        // Detect a new client run (seq restarted at 0) and namespace this
        // batch's mob ids by run. Done once at ingestion so cache replays,
        // live applies, and loot all see the remapped ids. mob 0 = "unknown"
        // stays 0. Dump-mode sub-batch splitting never re-emits seq 0, so
        // this only fires on genuine client restarts.
        if (msg.batch.seq === 0 && lastBatchSeq !== null) mobEpoch++;
        lastBatchSeq = msg.batch.seq;
        if (mobEpoch > 0 && msg.batch.events) {
          for (const ev of msg.batch.events) {
            if (ev.mob) ev.mob += mobEpoch * 1000000;
          }
        }
        const batchLogTs = msg.batch.events && msg.batch.events.length
          ? Math.max(...msg.batch.events.map(e => e.ts))
          : (S.lastTs || 0);
        // In session mode: stop at the session end boundary.
        if (SESSION_END_LOG_TS > 0 && batchLogTs > SESSION_END_LOG_TS) {
          cacheComplete = true;
          if (sessionPreloading) {
            tlPaused = true;
            tlIsLive = false;
            updatePlayPauseBtn();
            snapSessionToStart();
          } else {
            tlPaused = true;
            tlIsLive = false;
            updatePlayPauseBtn();
            scheduleRender();
          }
          return;
        }
        // In session mode: drop batches that predate the session window entirely.
        // They are not applied to state and not cached — no cross-session leakage.
        if (SESSION_LOG_TS > 0 && batchLogTs < SESSION_LOG_TS) return;
        // Cache every in-session batch for client-side seeking.
        cachedBatches.push({ logTs: batchLogTs, batch: msg.batch });
        // During preloading, only accumulate the cache; state will be rebuilt
        // from the cache once preloading completes (snapSessionToStart).
        // This prevents pre-seek state from contaminating the session view.
        if (sessionPreloading) return;
        applyBatch(msg.batch);
        // Update timeline bounds from each batch's EQ log timestamp.
        // This is the primary signal for dump-mode streams where all
        // wall-clock timestamps collapse to the same second.
        if (S.lastTs) {
          if (!tlFirstTs) tlFirstTs = S.lastTs;
          // Only advance the upper wall-clock bound while live; during replay
          // catch-up the server already provided the true end via the 'info'
          // message and advancing here would make every batch appear to be at
          // the end of the seek bar (frac always = 1.0).
          if (!tlLastTs || (tlIsLive && S.lastTs > tlLastTs)) tlLastTs = S.lastTs;
          // Track EQ log-event range; used for seek bar display & seeking.
          // logFirstTs / logLastTs are seeded from the 'info' message when the
          // server provides them.  During replay we must NOT advance logLastTs
          // from batch data — doing so collapses the scrubber fraction to 1.0
          // on every batch, pinning the bar to the right end.
          if (!logFirstTs) logFirstTs = S.lastTs;
          if (!logLastTs || (tlIsLive && S.lastTs > logLastTs)) logLastTs = S.lastTs;
          if (tlIsLive) {
            updateTimelineBar();
            setScrubberToEnd();
          } else {
            updateTimelineBar();
            if (!scrubberDragging) {
              const dispFirst = logFirstTs || tlFirstTs;
              const dispLast  = logLastTs  || tlLastTs;
              if (dispFirst && dispLast && dispLast > dispFirst) {
                const frac = Math.max(0, Math.min(1, (S.lastTs - dispFirst) / (dispLast - dispFirst)));
                scrubber.value = Math.round(frac * 1000);
                updateScrubberTrack();
                tlPosLabel.textContent = fmtTsPos(S.lastTs);
              }
            }
          }
        }
        scheduleRender();
      } catch(_) {}
    }
  };
  ws.onclose   = () => { ws = null; setStatus('error', '● reconnecting…'); cacheComplete = false; sessionPreloading = false; cachedBatches.length = 0; wsTimer = setTimeout(connectWS, 5000); };
  ws.onerror   = () => {};
}

function sendWS(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
  }
}

// ── Timeline seek bar ────────────────────────────────────────────────────────
const scrubber   = document.getElementById('tl-scrubber');
const tlBar      = document.getElementById('timeline-bar');
const tlStart    = document.getElementById('tl-label-start');
const tlEnd      = document.getElementById('tl-label-end');
const tlPosLabel = document.getElementById('tl-pos-label');
const tlLiveBtn  = document.getElementById('tl-live-btn');

function fmtTs(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}
function fmtTsPos(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000);
  return d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
}

/// Display bounds for the scrubber: a manually-selected pull scopes the bar
/// to its own window; otherwise the full session/log range.
function tlDisplayBounds() {
  if (tlEncScope) return [tlEncScope.start, tlEncScope.end];
  return [logFirstTs || tlFirstTs, logLastTs || tlLastTs];
}

function updateTimelineBar() {
  // Require valid wall-clock bounds from the server for seek to work.
  if (!tlFirstTs || !tlLastTs) return;
  // The bar earns its space: hidden while watching live with nothing
  // manually selected. Clicking a pull summons it (scoped to that pull);
  // any non-live state keeps it visible so replay controls are never lost.
  const shouldShow = encManuallySelected || !tlIsLive;
  if (!shouldShow) {
    tlBar.classList.remove('visible');
    document.documentElement.style.setProperty('--tl-height', '0px');
    return;
  }
  const [dispFirst, dispLast] = tlDisplayBounds();
  if (!dispFirst || !dispLast || dispLast <= dispFirst) return;
  tlBar.classList.add('visible');
  document.documentElement.style.setProperty('--tl-height', '28px');
  tlStart.textContent = fmtTs(dispFirst);
  tlEnd.textContent   = fmtTs(dispLast);
}

function setScrubberToEnd() {
  scrubber.value = 1000;
  updateScrubberTrack();
  tlPosLabel.textContent = '';
}

function updateLiveBtn() {
  if (!tlCanGoLive) {
    tlLiveBtn.style.display = 'none';
    return;
  }
  tlLiveBtn.style.display = '';
  if (tlIsLive) {
    tlLiveBtn.textContent = '● Live';
    tlLiveBtn.classList.add('live');
  } else {
    tlLiveBtn.textContent = 'Go Live';
    tlLiveBtn.classList.remove('live');
  }
}

function updatePlayPauseBtn() {
  const btn = document.getElementById('tl-playpause');
  if (!btn) return;
  if (tlPaused) {
    btn.innerHTML = '&#9654;';
    btn.title = 'Resume';
    btn.classList.add('is-paused');
    btn.classList.remove('is-playing');
  } else {
    btn.innerHTML = '||';
    btn.title = 'Pause';
    btn.classList.remove('is-paused');
    btn.classList.add('is-playing');
  }
}

// ── Seek bar progress fill (Chromium/Safari) ─────────────────────────────────
// Firefox uses ::-moz-range-progress in CSS; for other engines we paint a
// gradient from the left edge to the thumb position on the track background.
function updateScrubberTrack() {
  const pct = (scrubber.value / 1000) * 100;
  scrubber.style.background =
    `linear-gradient(to right, #5a9aff 0%, #5a9aff ${pct}%, #333 ${pct}%, #333 100%)`;
}

// Update track when the live-replay scrubber is moved in the batch handler.
// We track via explicit calls instead; see all scrubber.value assignments above.

let scrubberDragging = false;
document.getElementById('tl-speed').addEventListener('change', () => {
  if (!tlIsLive && !tlPaused) {
    const speed = parseFloat(document.getElementById('tl-speed').value) || 1.0;
    sendWS({ t: 'resume', speed });
  }
});

scrubber.addEventListener('mousedown', () => { scrubberDragging = true; });
scrubber.addEventListener('touchstart', () => { scrubberDragging = true; });
scrubber.addEventListener('mouseup',   () => { scrubberDragging = false; commitSeek(); });
scrubber.addEventListener('touchend',  () => { scrubberDragging = false; commitSeek(); });
scrubber.addEventListener('input', () => {
  updateScrubberTrack();
  const frac = scrubber.value / 1000;
  const [dispFirst, dispLast] = tlDisplayBounds();
  if (dispFirst && dispLast) {
    const ts = Math.round(dispFirst + frac * (dispLast - dispFirst));
    tlPosLabel.textContent = fmtTsPos(ts);
  }
});

function commitSeek() {
  if (sessionPreloading) return;
  const frac = scrubber.value / 1000;
  if (!tlFirstTs || !tlLastTs) return;
  const speed = parseFloat(document.getElementById('tl-speed').value) || 1.0;
  // At the far right of the bar: go live in normal mode; in session mode stay
  // within the session and seek to the session end instead of going live.
  if (frac >= 0.999) {
    if (tlEncScope) {
      // Pull-scoped bar: far right is the pull's end, not "go live".
      seekToLogTs(tlEncScope.end);
      return;
    }
    if (SESSION_LOG_TS > 0) {
      const dispLast = logLastTs || tlLastTs;
      if (dispLast) seekToLogTs(dispLast);
    } else {
      goLive();
    }
    return;
  }
  tlIsLive = false;
  const seekPaused = !tlCanGoLive;
  if (seekPaused) {
    tlPaused = true;
  } else {
    tlPaused = false;
  }
  updateLiveBtn();
  updatePlayPauseBtn();

  // Prefer log-event timestamps for seeking (pull-scoped when a pull is selected).
  const [seekFirst, seekLast] = tlDisplayBounds();
  if (seekFirst && seekLast && seekLast > seekFirst) {
    const targetLogTs = Math.round(seekFirst + frac * (seekLast - seekFirst));
    // Try cache-first seek; fall back to full re-stream if cache not ready.
    if (!seekWithCache(targetLogTs, seekPaused, speed)) {
      pendingMobRestore = selectedMob;
      if (seekPaused) {
        sendWS({ t: 'seek_full_paused_log', to_log_ts: targetLogTs });
      } else {
        sendWS({ t: 'seek_full_log', to_log_ts: targetLogTs, speed });
      }
      resetState();
    }
  } else {
    const targetTs = Math.round(tlFirstTs + frac * (tlLastTs - tlFirstTs));
    pendingMobRestore = selectedMob;
    resetState();
    if (seekPaused) {
      sendWS({ t: 'seek_full_paused', to_ts: targetTs });
    } else {
      sendWS({ t: 'seek_full', to_ts: targetTs, speed });
    }
  }
}

function goLive() {
  tlIsLive = true;
  tlPaused = false;
  liveAutoSelect = true;
  pendingMobRestore = null;
  // Back to live view: drop the pull-scoped bar (it hides until the next click).
  encManuallySelected = false;
  tlEncScope = null;
  document.getElementById('tl-speed').value = '1';
  updateLiveBtn();
  updatePlayPauseBtn();
  setScrubberToEnd();
  resetState();
  sendWS({ t: 'live' });
}

// ── Transport controls ─────────────────────────────────────────────────────

function togglePlayPause() {
  if (sessionPreloading) return;
  if (!tlFirstTs || !tlLastTs) return;
  if (tlIsLive) {
    // Pause from live: seek to the last known position and stay paused.
    tlPaused = true;
    tlIsLive = false;
    updateLiveBtn();
    updatePlayPauseBtn();
    const targetLogTs = logLastTs || tlLastTs;
    if (!seekWithCache(targetLogTs, true, 1.0)) {
      // Cache not complete yet — fall back to full re-stream.
      resetState();
      if (logLastTs) {
        sendWS({ t: 'seek_full_paused_log', to_log_ts: logLastTs });
      } else {
        sendWS({ t: 'seek_full_paused', to_ts: tlLastTs });
      }
    }
    return;
  }
  if (tlPaused) {
    // Resume replay.
    tlPaused = false;
    updatePlayPauseBtn();
    const speed = parseFloat(document.getElementById('tl-speed').value) || 1.0;
    sendWS({ t: 'resume', speed });
  } else {
    // Pause during replay.
    tlPaused = true;
    updatePlayPauseBtn();
    sendWS({ t: 'pause' });
  }
}

// Seek to a log-event timestamp, keeping the current play/pause state.
function seekToLogTs(targetLogTs) {
  const [dispFirst, dispLast] = tlDisplayBounds();
  if (!dispFirst || !dispLast || dispLast <= dispFirst || !tlFirstTs || !tlLastTs) return;
  const frac = Math.max(0, Math.min(1, (targetLogTs - dispFirst) / (dispLast - dispFirst)));
  const speed = parseFloat(document.getElementById('tl-speed').value) || 1.0;
  scrubber.value = Math.round(frac * 1000);
  updateScrubberTrack();
  tlPosLabel.textContent = fmtTsPos(targetLogTs);
  tlIsLive = false;
  updateLiveBtn();
  // Try cache-first; fall back to full re-stream.
  if (!seekWithCache(targetLogTs, tlPaused, speed)) {
    if (pendingMobRestore === null) pendingMobRestore = selectedMob;
    resetState();
    if (logFirstTs && logLastTs && logLastTs > logFirstTs) {
      const targetLogTs2 = Math.round(targetLogTs);
      if (tlPaused) {
        sendWS({ t: 'seek_full_paused_log', to_log_ts: targetLogTs2 });
      } else {
        sendWS({ t: 'seek_full_log', to_log_ts: targetLogTs2, speed });
      }
    } else {
      const targetWallTs = Math.round(tlFirstTs + frac * (tlLastTs - tlFirstTs));
      if (tlPaused) {
        sendWS({ t: 'seek_full_paused', to_ts: targetWallTs });
      } else {
        sendWS({ t: 'seek_full', to_ts: targetWallTs, speed });
      }
    }
  }
}

function rewind() {
  if (sessionPreloading) return;
  const dispFirst = logFirstTs || tlFirstTs;
  const dispLast  = logLastTs  || tlLastTs;
  if (!dispFirst || !dispLast) return;
  const currentLogTs = (S.lastTs && S.lastTs >= dispFirst) ? S.lastTs : dispFirst;
  seekToLogTs(Math.max(dispFirst, currentLogTs - 120));
}

function fastForward() {
  if (sessionPreloading) return;
  const dispFirst = logFirstTs || tlFirstTs;
  const dispLast  = logLastTs  || tlLastTs;
  if (!dispFirst || !dispLast) return;
  const currentLogTs = (S.lastTs && S.lastTs >= dispFirst) ? S.lastTs : dispFirst;
  const targetLogTs = currentLogTs + 120;
  if (SESSION_LOG_TS > 0) {
    // Session mode: clamp to session end, never cross into live or next session.
    seekToLogTs(Math.min(targetLogTs, dispLast));
  } else {
    if (targetLogTs >= dispLast * 0.999) { goLive(); return; }
    seekToLogTs(targetLogTs);
  }
}

function setStatus(cls, txt) {
  const el = document.getElementById('status');
  el.className = cls; el.textContent = txt;
}

// ── Clocks ────────────────────────────────────────────────────────────────────
function updateWallClock() {
  // Hide the current wall-clock for completed recordings — it's irrelevant.
  if (!tlCanGoLive) {
    document.getElementById('wall-clock').textContent = '';
    return;
  }
  const now = new Date();
  const mo = now.toLocaleString('en-US', { month: 'short' });
  const d  = now.getDate();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('wall-clock').textContent = `${mo} ${d}  ${hh}:${mm}`;
}
updateWallClock();
setInterval(updateWallClock, 10000);

function updateLogClock(d) {
  const el = document.getElementById('log-clock');
  // Hide the log timestamp for completed recordings — the timeline bar already
  // shows position and the timestamps appear in the mob label when selected.
  if (!tlCanGoLive) { el.textContent = ''; return; }
  el.textContent = d.last_log_time ? `log: ${d.last_log_time}` : '';
}

// Re-render periodically to keep mob activity timers and cast bars current.
setInterval(() => { if (lastData) scheduleRender(); }, 1000);

// ── Session picker ────────────────────────────────────────────────────────────
const sessionSel = document.getElementById('tl-session');

function onSessionChange(val) {
  const url = new URL(location.href);
  if (!val) {
    url.searchParams.delete('session');
  } else {
    url.searchParams.set('session', val);
  }
  location.href = url.toString();
}

if (SESSIONS_PATH) {
  fetch(SESSIONS_PATH)
    .then(r => r.ok ? r.json() : [])
    .then(sessions => {
      if (!sessions || sessions.length === 0) return;
      const urlSession = new URL(location.href).searchParams.get('session');
      const currentNum = urlSession ? parseInt(urlSession, 10) : null;
      // No session param: redirect to the most recent session so the page
      // always opens on the latest play session rather than the full journal.
      if (!currentNum) {
        onSessionChange(sessions[sessions.length - 1].num);
        return;
      }
      sessionSel.innerHTML = '';
      for (let i = sessions.length - 1; i >= 0; i--) {
        const s = sessions[i];
        const opt = document.createElement('option');
        opt.value = s.num;
        opt.textContent = i === sessions.length - 1
          ? `Latest — ${s.label}`
          : `#${s.num} — ${s.label}`;
        if (currentNum === s.num) opt.selected = true;
        sessionSel.appendChild(opt);
      }
      sessionSel.style.display = 'inline-block';
    })
    .catch(() => {});
}

// Restore mob selection from URL hash on page load (#mob-<id>).
// Setting pendingMobRestore before connectWS means scheduleRender will
// automatically select the mob once data arrives without any extra seek.
(function() {
  const m = location.hash.match(/^#mob-(\d+)$/);
  if (m) pendingMobRestore = +m[1];
})();

connectWS();

// Live ticker: keeps the active pull's running timer, DPS, and mob ages
// moving between combat lines (swings can be seconds apart). Skipped when
// the tab is hidden - browsers throttle it there anyway.
setInterval(() => {
  if (tlIsLive && lastData && !document.hidden) {
    lastData = buildRenderState();
    rerender();
  }
}, 1000);

// ── Resizable columns ─────────────────────────────────────────────────────────
// Drag the divider right of the Mobs or Summary panel to resize it; widths
// persist per browser (localStorage). Double-click a divider to reset.
(function initColResizers() {
  for (const key of ['mobs', 'summary']) {
    const saved = parseInt(localStorage.getItem('colw-' + key), 10);
    if (saved >= 120 && saved <= 800) {
      const el = document.getElementById(key);
      el.style.width = saved + 'px';
      el.style.minWidth = saved + 'px';
    }
  }
  document.querySelectorAll('.col-resizer').forEach(rz => {
    const target = document.getElementById(rz.dataset.target);
    rz.addEventListener('click', e => e.stopPropagation()); // keep selection
    rz.addEventListener('dblclick', e => {
      e.stopPropagation();
      target.style.width = '';
      target.style.minWidth = '';
      localStorage.removeItem('colw-' + rz.dataset.target);
    });
    rz.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      const startX = e.clientX;
      const startW = target.getBoundingClientRect().width;
      rz.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      const move = ev => {
        const w = Math.max(120, Math.min(800, startW + ev.clientX - startX));
        target.style.width = w + 'px';
        target.style.minWidth = w + 'px';
      };
      const up = () => {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        rz.classList.remove('dragging');
        document.body.style.cursor = '';
        localStorage.setItem('colw-' + rz.dataset.target,
          Math.round(target.getBoundingClientRect().width));
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });
  });
})();
</script>
</body>
