<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>froklog — stream viewer</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #141414; color: #ddd; overflow: hidden; }

  /* ── Header ── */
  #header {
    background: #1e1e1e; padding: 4px 10px; height: 45px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid #333;
  }
  #fight-label {
    flex: 1; display: flex; flex-direction: row; align-items: center;
    padding-left: 8px; border-left: 3px solid #444; gap: 12px; overflow: hidden;
  }
  .fl-name-wrap { overflow: hidden; flex-shrink: 1; min-width: 0; }
  .fl-name    { font-size: 28px; font-weight: bold; color: #f0a030; line-height: 1;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .fl-stats   { display: flex; flex-direction: row; align-items: center;
                gap: 7px; flex-shrink: 0; }
  .fl-stat-block { display: flex; flex-direction: column; align-items: center;
                   padding: 2px 10px; border-radius: 4px; border: 1px solid #2e2e2e;
                   background: rgba(255,255,255,0.03); }
  .fl-stat-dmg  { background: rgba(92,200,232,0.07);  border-color: rgba(92,200,232,0.22); }
  .fl-stat-dur  { background: rgba(180,180,255,0.05); border-color: rgba(160,160,220,0.18); }
  .fl-stat-seen { background: rgba(180,140,55,0.07);  border-color: rgba(180,140,55,0.22); }
  .fl-stat-label { font-size: 8px; text-transform: uppercase; letter-spacing: 0.1em;
                   color: #888; line-height: 1.4; }
  .fl-totdmg  { font-size: 18px; color: #5cc8e8; font-weight: bold; line-height: 1.1; }
  .fl-secs    { font-size: 18px; color: #ddd; font-weight: bold; line-height: 1.1; }
  .fl-seen    { font-size: 11px; color: #999; line-height: 1.2; white-space: nowrap; }
  .fl-restart { font-size: 20px; color: #888; cursor: pointer; padding: 2px 5px; line-height: 1;
                border-radius: 3px; transition: color 0.15s, background 0.15s; user-select: none; }
  .fl-restart:hover { color: #f0c040; background: rgba(200,170,30,0.15); }
  #stream-badge {
    font-size: 11px; color: #888; background: #2a2a2a;
    padding: 2px 6px; border-radius: 3px; border: 1px solid #3a3a3a;
  }
  #status { font-size: 11px; }
  #status.live  { color: #4f4; }
  #status.poll  { color: #fa0; }
  #status.error { color: #f44; }
  #status.done  { color: #7ab8f5; }
  #player-name  { color: #a4f; }

  #time-display {
    display: flex; flex-direction: column; align-items: flex-end;
    font-size: 10px; color: #888; line-height: 1.3;
    margin-right: 4px;
  }
  #time-display .td-now  { color: #bbb; }
  #time-display .td-log  { color: #666; }

  /* ── Timeline / seek bar ── */
  #timeline-bar {
    background: #181818; padding: 4px 10px;
    display: none; align-items: center; gap: 8px;
    border-bottom: 1px solid #2a2a2a; height: 28px;
    flex-shrink: 0;
  }
  #timeline-bar.visible { display: flex; }
  #tl-label-start { font-size: 10px; color: #666; white-space: nowrap; flex-shrink: 0; }
  #tl-label-end   { font-size: 10px; color: #666; white-space: nowrap; flex-shrink: 0; }
  #tl-scrubber {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; background: #333; border-radius: 2px; outline: none; cursor: pointer;
  }
  #tl-scrubber::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #5a9aff; cursor: pointer;
  }
  #tl-scrubber::-moz-range-thumb {
    width: 12px; height: 12px; border: none;
    border-radius: 50%; background: #5a9aff; cursor: pointer;
  }
  #tl-scrubber::-moz-range-progress {
    background: #5a9aff; height: 4px; border-radius: 2px 0 0 2px;
  }
  #tl-scrubber::-moz-range-track {
    background: #333; height: 4px; border-radius: 2px;
  }
  #tl-speed {
    font-size: 11px; color: #aaa; background: #252525; border: 1px solid #3a3a3a;
    border-radius: 3px; padding: 1px 4px; cursor: pointer; font-family: monospace;
  }
  #tl-live-btn {
    font-size: 11px; color: #888; background: #202020; border: 1px solid #3a3a3a;
    border-radius: 3px; padding: 2px 7px; cursor: pointer; font-family: monospace;
    white-space: nowrap;
  }
  #tl-live-btn.live { color: #4f4; border-color: #3c6c3c; background: #1a2a1a; }
  #tl-session {
    font-size: 11px; color: #aaa; background: #252525; border: 1px solid #3a3a3a;
    border-radius: 3px; padding: 1px 4px; cursor: pointer; font-family: monospace;
    max-width: 160px; display: none;
  }
  #tl-pos-label { font-size: 10px; color: #e0c060; min-width: 90px; text-align: right; flex-shrink: 0; font-weight: bold; }
  .tl-transport {
    font-size: 13px; color: #aaa; background: #202020; border: 1px solid #3a3a3a;
    border-radius: 3px; padding: 0 7px; cursor: pointer; font-family: monospace;
    white-space: nowrap; flex-shrink: 0; line-height: 22px;
  }
  .tl-transport:hover { color: #fff; border-color: #555; }
  .tl-transport.is-paused  { color: #5aff5a; border-color: #3c6c3c; }
  .tl-transport.is-playing  { color: #ffb347; border-color: #6c5020; }

  /* ── Main layout ── */
  #layout { display: flex; height: calc(100vh - 45px - var(--tl-height, 0px)); overflow: hidden; }
  .col-resizer {
    flex: 0 0 5px; cursor: col-resize; background: transparent;
    margin-left: -1px; /* overlaps the panel border so the grab zone is easy to hit */
    transition: background .12s;
  }
  .col-resizer:hover, .col-resizer.dragging { background: #3a4a6a; }

  /* ── Mob panel ── */
  #mobs {
    width: 233px; min-width: 233px; background: #161616;
    border-right: 1px solid #333; display: flex; flex-direction: column;
  }
  .panel-hdr {
    height: 22px; display: flex; align-items: center;
    padding: 0 6px; font-size: 11px; font-weight: bold; color: #999;
    border-bottom: 1px solid #2a2a2a; flex-shrink: 0;
  }
  #enc-select {
    width: 100%; background: #161616; color: #999; border: none;
    font: bold 11px inherit; padding: 2px 0; cursor: pointer; outline: none;
  }
  #enc-select option { background: #161616; color: #bbb; font-weight: normal; }
  #mob-scroll { overflow-y: auto; flex: 1; min-height: 0; }
  .mob-row {
    display: flex; align-items: center; padding: 0 4px;
    height: 16px; cursor: pointer; user-select: none;
  }
  .mob-row:hover { background: #1e1e1e; }
  .mob-row.selected { background: #252535; }
  .mob-row.mob-active  { background: rgba(60,220,60,0.07);  box-shadow: inset 2px 0 0 rgba(60,220,60,0.45); }
  .mob-row.mob-alive   { background: rgba(200,170,30,0.05); box-shadow: inset 2px 0 0 rgba(200,170,30,0.4); }
  .mob-row.mob-active:hover { background: rgba(60,220,60,0.13); }
  .mob-row.mob-alive:hover  { background: rgba(200,170,30,0.10); }
  .mob-row.mob-active.selected { background: #1c2d1c; box-shadow: inset 2px 0 0 rgba(60,220,60,0.7); }
  .mob-row.mob-alive.selected  { background: #2c2816; box-shadow: inset 2px 0 0 rgba(200,170,30,0.6); }
  .enc-row {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px 3px;
    margin-top: 6px; cursor: pointer; user-select: none;
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    color: #8a8a8a; background: #161616; border-top: 1px solid #262626;
  }
  .enc-row:hover { background: #1e1e1e; }
  .enc-row.selected { background: #252535; color: #cdd6f4; }
  .enc-row.enc-active { color: #7ce87c; background: rgba(60,220,60,0.06); }
  .enc-row .enc-count { margin-left: auto; color: #666; font-size: 10px; text-transform: none; }
  .fl-enc-comp { color: #777; font-size: 10px; margin-left: 10px; white-space: nowrap;
                 overflow: hidden; text-overflow: ellipsis; }
  .enc-row.enc-named { color: #e8c76a; background: rgba(232,199,106,0.06); }
  .enc-row.enc-named.enc-active { color: #7ce87c; }
  .mob-row.enc-member { padding-left: 18px; }
  .mob-row .mob-name.named { color: #e8c76a !important; }
  .mob-dot { font-size: 9px; margin-right: 3px; flex-shrink: 0; line-height: 1; }
  .mob-name { flex: 1; font-size: 11px; overflow: hidden; white-space: nowrap; }
  .mob-time { font-size: 10px; color: #666; margin-left: 4px; flex-shrink: 0; }

  /* ── Summary panel ── */
  #summary {
    width: 300px; min-width: 300px; background: #191919;
    border-right: 1px solid #333; display: flex; flex-direction: column;
  }
  #sum-header-area { flex-shrink: 0; }
  #sum-scroll { overflow-y: auto; flex: 1; }
  #sum-rows { padding-top: 6px; }

  /* Mode tabs */
  #mode-tabs { display: flex; height: 22px; border-bottom: 1px solid #2a2a2a; }
  .mode-tab {
    flex: 1; font-size: 11px; background: none;
    border: none; border-right: 1px solid #2a2a2a;
    cursor: pointer; font-family: monospace; padding: 0;
  }
  .mode-tab:last-child { border-right: none; }
  .tab-damage  { color: #aaa; background: #2e0a0a; }
  .tab-healing { color: #aaa; background: #0a1e0d; }
  .tab-healed  { color: #aaa; background: #081c1c; }
  .tab-tanked  { color: #aaa; background: #1c1500; }
  .tab-avoid   { color: #aaa; background: #100820; }
  .tab-loot    { color: #aaa; background: #1c1100; }
  .tab-damage:hover  { color: #eee; background: #4a1010; }
  .tab-healing:hover { color: #eee; background: #103518; }
  .tab-healed:hover  { color: #eee; background: #0e2e2e; }
  .tab-tanked:hover  { color: #eee; background: #302200; }
  .tab-avoid:hover   { color: #eee; background: #1e1038; }
  .tab-loot:hover    { color: #eee; background: #301e00; }
  .tab-damage.active  { color: #fff; background: #7a1818; }
  .tab-healing.active { color: #fff; background: #1a7030; }
  .tab-healed.active  { color: #fff; background: #126060; }
  .tab-tanked.active  { color: #fff; background: #6a5200; }
  .tab-avoid.active   { color: #fff; background: #4a1878; }
  .tab-loot.active    { color: #fff; background: #6a4800; }

  .sum-hdr {
    display: flex; align-items: center; padding: 0 6px;
    height: 18px; font-size: 11px; font-weight: bold; color: #999;
    border-bottom: 1px solid #2a2a2a;
  }
  .sum-hdr .sh-name { flex: 1; }
  /* Shared grid tracks: every row (and the header) uses the same column
     template, so values line up in true columns instead of drifting with
     each row's name/class width. */
  .sum-row, .sum-hdr {
    display: grid;
    /* All tracks fixed except the 1fr name column — separate grid containers
       don't share max-content sizing, so only fixed tracks align across rows. */
    grid-template-columns: minmax(80px, 1fr) 62px 48px 42px 42px;
    gap: 4px; align-items: center; padding: 0 6px;
  }
  .sum-row { height: 18px; font-size: 11px; }
  .sum-row:hover { background: #222; }
  .sum-hdr {
    height: 17px; font-size: 9px; text-transform: uppercase; letter-spacing: .06em;
    color: #667; border-bottom: 1px solid #2a2a2a; position: sticky; top: 0;
    background: #191919; z-index: 1;
  }
  .sum-hdr span { text-align: right; }
  .sum-hdr .h-name { text-align: left; }
  .sum-hdr span:nth-child(2) { text-align: left; }
  .sum-name { color: #eee; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .sum-class { font-size: 10px; }
  .sum-val  { text-align: right; color: #ccc; }
  .sum-rate { text-align: right; color: #888; font-size: 10px; }
  .sum-pct  { text-align: right; color: #666; font-size: 10px; }

  /* ── Card grid ── */
  #cards { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; }

  /* ── Individual card ── */
  .card {
    width: 220px; border: 1px solid #373737; border-radius: 2px;
    background: #1c1c1c; overflow: hidden;
  }
  .card-hdr {
    padding: 3px 6px; font-size: 12px; font-weight: bold; color: #fff;
    display: flex; gap: 5px; align-items: baseline;
  }
  .card-hdr .cls { font-size: 11px; }
  .card-hdr .lvl { margin-left: auto; font-size: 10px; font-weight: bold; flex-shrink: 0; background: #000; color: #fff; border-radius: 8px; padding: 1px 5px; line-height: 1.4; }
  .card-hdr .pet { margin-left: auto; font-size: 10px; font-weight: bold; flex-shrink: 0; background: #1a3550; color: #7ab0e0; border-radius: 8px; padding: 1px 5px; line-height: 1.4; }
  .card-hdr .cls span { color: #fff !important; }
  .card-col-hdr {
    display: flex; align-items: center; padding: 1px 4px;
    font-size: 10px; font-weight: bold; color: #999;
    border-bottom: 1px solid #2a2a2a; margin-top: 2px; height: 15px;
  }
  .c-type { flex: 1; position: relative; overflow: hidden; white-space: nowrap; }
  .c-val  { width: 54px; text-align: right; flex-shrink: 0; }
  .c-rate { width: 48px; text-align: right; flex-shrink: 0; }

  .type-row {
    display: flex; align-items: center; height: 16px;
    padding: 0 4px; font-size: 11px;
  }
  .type-bar {
    position: absolute; left: 0; top: 0; height: 100%;
    opacity: 0.35; pointer-events: none;
  }
  .type-label { position: relative; z-index: 1; }
  .type-row .c-val  { color: #d2d2d2; }
  .type-row .c-rate { color: #888; font-size: 10px; }

  .spell-sep {
    border: none; border-top: 1px solid #2a2a2a;
    margin: 3px 4px 1px;
  }
  .card-pad { height: 3px; }

  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #444; font-size: 20px; padding: 40px;
  }
  .waiting-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #555; font-size: 36px; padding: 40px;
  }

  /* ── Cast bar ── */
  .cast-bar {
    position: relative; overflow: hidden;
    height: 15px; background: #4a1a7a;
    display: flex; align-items: center; padding: 0 5px;
    border-top: 1px solid #6a3a9a;
  }
  .cast-bar-shimmer {
    position: absolute; top: 0; left: -60%; width: 60%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(200,160,255,0.18), transparent);
    animation: cast-shimmer 1.4s ease-in-out infinite;
    pointer-events: none;
  }
  .cast-bar-text {
    position: relative; z-index: 1;
    font-size: 10px; color: #d0a8ff; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; width: 100%;
  }
  @keyframes cast-shimmer {
    0%   { left: -60%; }
    100% { left: 120%; }
  }
  /* ── Graph strip ── */
  #cards-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #graph-header {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 6px; height: 20px; flex-shrink: 0;
    border-bottom: 1px solid #222; background: #181818;
  }
  #graph-toggle {
    font-size: 10px; color: #555; background: none;
    border: 1px solid #2a2a2a; border-radius: 2px;
    padding: 0 6px; cursor: pointer; font-family: monospace; height: 16px;
  }
  #graph-toggle:hover { color: #aaa; border-color: #555; }
  #graph-toggle.active { color: #aaa; border-color: #4a4a6a; background: #1e1e2e; }
  #graph-strip {
    height: 160px; flex-shrink: 0;
    background: #161616; border-bottom: 1px solid #2a2a2a;
    padding: 6px; display: flex; gap: 6px;
  }
  .graph-pane { flex: 1; position: relative; min-width: 0; }
  #cards-scroll { flex: 1; overflow: auto; padding: 6px; }

  /* ── Scrollbars ── */
  /* Firefox */
  #mob-scroll, #sum-scroll, #cards-scroll {
    scrollbar-width: thin;
    scrollbar-color: #3a3a3a #141414;
  }
  /* Webkit (Chrome, Edge, Safari) */
  #mob-scroll::-webkit-scrollbar,
  #sum-scroll::-webkit-scrollbar,
  #cards-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  #mob-scroll::-webkit-scrollbar-track,
  #sum-scroll::-webkit-scrollbar-track,
  #cards-scroll::-webkit-scrollbar-track { background: #141414; }
  #mob-scroll::-webkit-scrollbar-thumb,
  #sum-scroll::-webkit-scrollbar-thumb,
  #cards-scroll::-webkit-scrollbar-thumb {
    background: #3a3a3a; border-radius: 3px;
  }
  #mob-scroll::-webkit-scrollbar-thumb:hover,
  #sum-scroll::-webkit-scrollbar-thumb:hover,
  #cards-scroll::-webkit-scrollbar-thumb:hover { background: #555; }

  /* Ensure the last mob row is never clipped by the scrollbar */
  #mob-rows { padding-bottom: 24px; }

  /* ── Loot tab content ── */
  .loot-player-hdr {
    display: flex; align-items: center; padding: 0 6px;
    height: 18px; font-size: 11px; font-weight: bold; color: #eee;
    border-bottom: 1px solid #2a2a2a;
  }
  .loot-empty {
    padding: 6px 8px; font-size: 11px; color: #555; font-style: italic;
  }
  .loot-kill {
    padding: 2px 6px 0;
  }
  .loot-kill-name {
    font-size: 10px; color: #777; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    border-bottom: 1px solid #222; margin-bottom: 1px; padding-bottom: 1px;
  }
  .loot-kill-coin {
    font-size: 10px; color: #c8aa1e; padding-left: 2px;
  }
  .loot-kill-items {
    display: flex; flex-wrap: wrap; gap: 2px; padding: 1px 2px 3px;
  }
  .loot-chip {
    font-size: 9px; padding: 0 4px; border-radius: 2px; line-height: 16px;
    white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
  }
  .loot-chip-kept    { background: #1e2e3a; color: #7ab8f5; border: 1px solid #2a4a5a; }
  .loot-chip-sold    { background: #2a2a1a; color: #c8a840; border: 1px solid #4a4020; }
  .loot-chip-hoard   { background: #2a1a3a; color: #b080e0; border: 1px solid #4a2a60; }
  .loot-chip-enhance { background: #1a2a1a; color: #60c060; border: 1px solid #2a4a2a; }
  .loot-session-totals {
    padding: 3px 6px; font-size: 10px; color: #bbb;
    border-bottom: 1px solid #222; margin-bottom: 2px;
  }
  .loot-session-totals .ls-coin    { color: #ffee1e; }
  .loot-session-totals .ls-sold    { color: #ffee1e; }
  .loot-session-totals .ls-kept    { color: #7ab8f5; }
  .loot-session-totals .ls-autosold { color: #c8a840; }
  .loot-session-totals .ls-enhance { color: #60c060; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="header">
  <div id="fight-label">No mob selected</div>
  <div id="stream-badge"><span id="player-name">__PLAYER_NAME__</span> · __STREAM_ID__</div>
  <div id="time-display">
    <span class="td-now" id="wall-clock"></span>
    <span class="td-log"  id="log-clock"></span>
  </div>
  <div id="status" class="error">● disconnected</div>
</div>

<div id="timeline-bar">
  <span id="tl-label-start"></span>
  <input id="tl-scrubber" type="range" min="0" max="1000" value="1000" step="1">
  <span id="tl-label-end"></span>
  <button id="tl-rewind"    class="tl-transport" onclick="rewind()"          title="Skip back 2 min">&#171;</button>
  <button id="tl-playpause" class="tl-transport" onclick="togglePlayPause()"  title="Pause">||</button>
  <button id="tl-ff"        class="tl-transport" onclick="fastForward()"      title="Skip forward 2 min">&#187;</button>
  <span id="tl-pos-label"></span>
  <select id="tl-speed" title="Playback speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
    <option value="8">8×</option>
    <option value="16">16×</option>
    <option value="32">32×</option>
  </select>
  <button id="tl-live-btn" onclick="goLive()">Go Live</button>
  <select id="tl-session" title="Session" onchange="onSessionChange(this.value)"></select>
</div>

<div id="layout" onclick="deselectMob()">
  <div id="mobs">
    <div class="panel-hdr">
      <select id="enc-select" title="Jump to a pull for playback"
              onclick="event.stopPropagation()"
              onchange="encSelectChanged(this.value)">
        <option value="">Mobs — all pulls</option>
      </select>
    </div>
    <div id="mob-scroll"><div id="mob-rows"></div></div>
  </div>
  <div class="col-resizer" data-target="mobs" title="Drag to resize — double-click to reset"></div>

  <div id="summary">
    <div id="sum-header-area"></div>
    <div id="sum-scroll"><div id="sum-rows"></div></div>
  </div>
  <div class="col-resizer" data-target="summary" title="Drag to resize — double-click to reset"></div>

  <div id="cards-wrap">
    <div id="graph-header">
      <button id="graph-toggle" onclick="event.stopPropagation();toggleGraph()">&#9660; Graph</button>
    </div>
    <div id="graph-strip" style="display:none">
      <div class="graph-pane"><canvas id="graph-canvas"></canvas></div>
      <div class="graph-pane"><canvas id="graph-canvas-rate"></canvas></div>
    </div>
    <div id="cards-scroll">
      <div id="cards"></div>
    </div>
  </div>
</div>

<script>
// ── Stream credentials injected server-side ───────────────────────────────────
const STREAM_ID      = '__STREAM_ID__';
const VIEW_TOKEN     = '__VIEW_TOKEN__';
const WS_PATH        = '__WS_PATH__';
const SESSIONS_PATH  = '__SESSIONS_PATH__';
const SESSION_LOG_TS     = __SESSION_LOG_TS__;
const SESSION_END_LOG_TS = __SESSION_END_LOG_TS__;

// ── In-memory batch cache ─────────────────────────────────────────────────────
// Stores every EventBatch received from the server in order.
// Used for client-side seeking so seeks don't require the server to re-stream
// the full history over the WebSocket.
// Each entry: { logTs: number, batch: EventBatch }
const cachedBatches = [];
// Client-run epoch for mob-id namespacing: the parser's mob-instance ids
// restart at 1 whenever the pushing client restarts, and the pusher's batch
// seq restarts at 0 with it. Without namespacing, a new run's "mob 5" merges
// into an older run's mob 5 — compounding damage into a stale entry far down
// the list instead of showing a fresh fight at the top.
let mobEpoch = 0;
let lastBatchSeq = null;
let cacheComplete = false;  // true once the initial catch-up is done

// ── Persistent mob registry ───────────────────────────────────────────────────
// Never cleared by resetState() or seek operations.  Tracks every mob ever
// encountered so the mob list stays stable when the user scrubs backwards.
// New mobs are appended in first-appearance order; the list is rendered
// newest-first so live mobs pop in at the top.
const allMobsEver  = {};   // mob_id -> { name }
// Names ever seen in lowercase (mid-sentence) form. EQ lowercases TRASH mob
// names mid-sentence but never lowercases NAMED/boss mobs ("You slash orc
// centurion" vs "You slash Marrowbane") — so a name that stays capitalized
// after enough lines is a named. Session-level knowledge, survives seeks.
const lowercaseNames = new Set();
function isNamedMob(name) {
  const c = name[0];
  return c === c.toUpperCase() && c !== c.toLowerCase()
    && !lowercaseNames.has(name.toLowerCase());
}
const allMobOrderEver = []; // mob_ids in first-appearance order (oldest first)
// Loot cache that spans seeks: populated from ALL cached batches, not just up
// to the current seek target.  Lets the loot tab show post-death loot when a
// mob is selected even if the timeline is positioned at the kill moment.
const allMobLootEver = {};  // mob_id -> { copper, items: [{item,qty,d,copper}] }

/// Replay all cached batches with logTs <= targetLogTs and return the count applied.
/// Does NOT reset state — caller must call resetState() first if needed.
function applyBatchesUpTo(targetLogTs) {
  let count = 0;
  for (const cb of cachedBatches) {
    if (cb.logTs > targetLogTs) break;
    applyBatch(cb.batch);
    count++;
  }
  return count;
}

/// After session preloading completes, apply all cached in-session batches
/// and position to the session end.  For the latest session on a live stream,
/// applies cached state and immediately subscribes to the live feed.
function snapSessionToStart() {
  sessionPreloading = false;
  resetState();

  // Latest session on a live stream: show accumulated session state then go live.
  if (SESSION_END_LOG_TS === 0 && tlCanGoLive) {
    applyBatchesUpTo(Infinity);
    S.casts = {};
    pendingMobRestore = null;
    liveAutoSelect = true;
    document.getElementById('tl-speed').value = '1';
    tlIsLive = true;
    tlPaused = false;
    updateLiveBtn();
    updatePlayPauseBtn();
    setScrubberToEnd();
    sendWS({ t: 'live' });
    updateTimelineBar();
    scheduleRender();
    return;
  }

  // Non-latest session or completed recording: show full accumulated state at end.
  const maxTs = SESSION_END_LOG_TS > 0 ? SESSION_END_LOG_TS : Infinity;
  applyBatchesUpTo(maxTs);
  S.casts = {};
  // After applying all batches, S.lastTs is the last event that produced
  // meaningful combat state.  Cap logLastTs to this so the seek bar doesn't
  // include non-combat tail time (e.g. hours of idle log after combat ends).
  if (S.lastTs && logLastTs && S.lastTs < logLastTs) logLastTs = S.lastTs;
  const endTs = logLastTs || SESSION_LOG_TS;
  scrubber.value = 1000;
  updateScrubberTrack();
  tlPosLabel.textContent = fmtTsPos(endTs);
  sendWS({ t: 'seek_paused_log', to_log_ts: endTs });
  updateTimelineBar();
  scheduleRender();
}

/// Seek entirely within the cache.  Resets state, applies batches up to
/// targetLogTs, schedules a render, then sends the direct SeekLog/SeekPausedLog
/// message so the server resumes streaming from that position forward.
/// Returns true if the cache was usable (covered targetLogTs or the cache is
/// complete), false if the caller should fall back to a full seek_full_log.
function seekWithCache(targetLogTs, paused, speed) {
  if (!cacheComplete && (cachedBatches.length === 0 ||
      cachedBatches[cachedBatches.length - 1].logTs < targetLogTs)) {
    return false;  // cache doesn't cover the target yet
  }
  pendingMobRestore = selectedMob;
  resetState();
  applyBatchesUpTo(targetLogTs);
  // Forward-fill allMobLootEver with loot from batches beyond the seek target
  // so the loot tab shows post-death loot when a mob is selected.
  for (const cb of cachedBatches) {
    if (cb.logTs <= targetLogTs) continue;
    for (const ev of cb.batch.events) applyLootToGlobal(ev);
  }
  scheduleRender();
  if (paused) {
    sendWS({ t: 'seek_paused_log', to_log_ts: targetLogTs });
  } else {
    sendWS({ t: 'seek_log', to_log_ts: targetLogTs, speed: speed || 1.0 });
  }
  return true;
}

// ── Class colours ─────────────────────────────────────────────────────────────
const CLASS_COLOR = {
  WAR:'#af803c', CLR:'#733273', PAL:'#7387fa', RNG:'#507334', SHD:'#4b4b41',
  DRU:'#649150', MNK:'#d2b48c', BRD:'#b4a032', ROG:'#505c55', SHM:'#a2a2b0',
  NEC:'#0164fa', WIZ:'#af0a32', MAG:'#960a0a', ENC:'#0a32c8', BST:'#826432',
  BER:'#be6414', '':'#464650',
};
// Precompute all valid EQ procedural pet names from the GetRandPetName() syllable tables.
const PET_NAMES = (() => {
  const p1 = ['G','J','K','L','V','X','Z'];
  const p2 = ['','ab','ar','as','eb','en','ib','ob','on'];
  const p3 = ['','an','ar','ek','ob'];
  const p4 = ['er','ab','n','tik'];
  const blocked = new Set(['Laser','Ektik']);
  const s = new Set();
  for (const a of p1) for (const b of p2) for (const c of p3) for (const d of p4) {
    if (!b && !c) continue;
    const name = a+b+c+d;
    if (!blocked.has(name)) s.add(name);
  }
  return s;
})();
function isPetName(name) { return PET_NAMES.has(name); }

function classColor(cls) { return CLASS_COLOR[cls] || CLASS_COLOR['']; }

// Renders each class code as a separately-colored <span>, joined by grey slashes.
function classCodesHtml(classes) {
  if (!classes || classes.length === 0) return '';
  return classes.map(c => `<span style="color:${classColor(c)}">${c}</span>`).join('<span style="color:#666">/</span>');
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// Returns a CSS background value: solid for 1 class, gradient for 2–3.
// Colors are rendered at reduced alpha so the dark card bg mutes the intensity.
function classHeaderStyle(classes) {
  if (!classes || classes.length === 0) return `background:${CLASS_COLOR['']}`;
  const c = classes.map(cls => hexToRgba(classColor(cls), 0.55));
  if (classes.length === 1) return `background:${c[0]}`;
  if (classes.length === 2)
    return `background:linear-gradient(90deg,${c[0]} 0%,${c[0]} 35%,${c[1]} 65%,${c[1]} 100%)`;
  // 3 classes — each owns roughly a third, with a short blend between zones.
  return `background:linear-gradient(90deg,${c[0]} 0%,${c[0]} 25%,${c[1]} 40%,${c[1]} 60%,${c[2]} 75%,${c[2]} 100%)`;
}

function fmtK(n) {
  if (n >= 1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  if (n >= 1e3) return Math.round(n/1e3)+'K';
  return String(n);
}
function fmtTime(secs) {
  if (secs < 60) return Math.round(secs) + 's';
  return Math.floor(secs/60) + 'm' + Math.floor(secs%60) + 's';
}
function truncate(s, n) { return s.length > n ? s.slice(0, n-1)+'…' : s; }

// Format a copper value as "6pp 3gp 7sp 3cp", skipping zero tiers.
function formatCopper(c) {
  if (!c) return '';
  const pp = Math.floor(c / 1000); c %= 1000;
  const gp = Math.floor(c / 100);  c %= 100;
  const sp = Math.floor(c / 10);   c %= 10;
  const cp = c;
  return [pp && `${pp}pp`, gp && `${gp}gp`, sp && `${sp}sp`, cp && `${cp}cp`].filter(Boolean).join(' ');
}
function formatCopperShort(c) {
  if (!c) return '';
  const pp = Math.floor(c / 1000);
  const gp = Math.floor((c % 1000) / 100);
  return [pp && `${pp}pp`, gp && `${gp}gp`].filter(Boolean).join(' ') || '<1gp';
}

// ── Accumulated combat state ──────────────────────────────────────────────────
// All state is rebuilt from incoming EventBatch messages.  The server sends the
// full journal on connect (catch-up) followed by live batches.
const S = {
  players:  {},  // name -> PlayerStats
  lootTimes: [], // log-ts of every loot action — pull-boundary signal
  heartbeats: [], // log-ts of combat heartbeats (stunned/OOM/interrupted)
  mobs:     {},  // mob_id (number) -> { name, lastTs, dead }
  mobDmg:   {},  // mob_id -> { player_name -> { dmg, dmgByType, dmgBySpell } }
  mobTank:  {},  // mob_id -> { player_name -> { dmg, dmgByType } }
  mobHeal:  {},  // mob_id -> { healer_name -> { heals, healsBySpell } }
  mobHealee:{},  // mob_id -> { healee_name -> { healed, healedBySpell } }
  avoidance:{},  // player_name -> { total, byType }
  mobAvoid: {},  // mob_id -> { player_name -> { total, byType } }
  mobDmgTL:    {},  // mob_id -> { player_name -> [{ts,v}] }
  mobTankTL:   {},  // mob_id -> { player_name -> [{ts,v}] }
  mobHealTL:   {},  // mob_id -> { healer_name -> [{ts,v}] }
  mobHealedTL: {},  // mob_id -> { healee_name -> [{ts,v}] }
  mobAvoidTL:  {},  // mob_id -> { player_name -> [{ts,v}] }
  fightStartTs: null,  // unix seconds of first combat event
  lastTs: 0,           // unix seconds of most recent event
  casts: {},           // player_name -> { spell, logTs }
  mobLoot: {},         // mob_id -> { copper: 0, items: [{item,qty,d,copper}] }
  sessionCoin: 0,      // total copper from corpses this session
  sessionSold: 0,      // total copper from auto-sells this session
  lootOrder: [],       // mob_ids in loot-event order (newest last)
  lootOrderSet: new Set(), // fast membership check for lootOrder
};

function player(name) {
  if (!S.players[name]) S.players[name] = {
    dmg:0, dmgByType:{}, dmgBySpell:{},
    heals:0, healsBySpell:{},
    healed:0, healedBySpell:{},
    cls:'', classes:[],
  };
  return S.players[name];
}
function mobDmgPlayer(mob, name) {
  if (!S.mobDmg[mob])       S.mobDmg[mob] = {};
  if (!S.mobDmg[mob][name]) S.mobDmg[mob][name] = { dmg:0, dmgByType:{}, dmgBySpell:{} };
  return S.mobDmg[mob][name];
}
function mobTankPlayer(mob, name) {
  if (!S.mobTank[mob])       S.mobTank[mob] = {};
  if (!S.mobTank[mob][name]) S.mobTank[mob][name] = { dmg:0, dmgByType:{} };
  return S.mobTank[mob][name];
}
function mobHealPlayer(mob, name) {
  if (!S.mobHeal[mob])       S.mobHeal[mob] = {};
  if (!S.mobHeal[mob][name]) S.mobHeal[mob][name] = { heals:0, healsBySpell:{} };
  return S.mobHeal[mob][name];
}
function mobHealeePlayer(mob, name) {
  if (!S.mobHealee[mob])       S.mobHealee[mob] = {};
  if (!S.mobHealee[mob][name]) S.mobHealee[mob][name] = { healed:0, healedBySpell:{} };
  return S.mobHealee[mob][name];
}
function mobAvoidPlayer(mob, name) {
  if (!S.mobAvoid[mob])       S.mobAvoid[mob] = {};
  if (!S.mobAvoid[mob][name]) S.mobAvoid[mob][name] = { total:0, byType:{} };
  return S.mobAvoid[mob][name];
}
function mobLootEntry(mob) {
  if (!S.mobLoot[mob]) {
    S.mobLoot[mob] = { copper: 0, items: [] };
    if (!S.lootOrderSet.has(mob)) { S.lootOrder.push(mob); S.lootOrderSet.add(mob); }
  }
  return S.mobLoot[mob];
}
function applyLootToGlobal(ev) {
  if (!allMobLootEver[ev.mob]) allMobLootEver[ev.mob] = { copper: 0, items: [] };
  const e = allMobLootEver[ev.mob];
  switch (ev.k) {
    case 'currency_loot': e.copper += ev.copper; break;
    case 'item_loot':     e.items.push({ item: ev.item, qty: ev.qty, d: 'kept', copper: 0 }); break;
    case 'item_sell':     e.items.push({ item: ev.item, qty: ev.qty, d: 'sold', copper: ev.copper }); break;
    case 'item_hoard':    e.items.push({ item: ev.item, qty: 1, d: 'hoard', copper: 0 }); break;
    case 'item_enhance':  e.items.push({ item: ev.item, qty: 1, d: 'enhance', copper: 0 }); break;
  }
}
function tlEntry(tl, mob, name) {
  if (!tl[mob]) tl[mob] = {};
  if (!tl[mob][name]) tl[mob][name] = [];
  return tl[mob][name];
}
function trackMob(mob, name, ts) {
  // DoT ticks on a dead mob arrive as "X's corpse" — strip the suffix so the
  // mob keeps its original name in the list.
  if (name.endsWith("'s corpse")) name = name.slice(0, -("'s corpse".length));
  // A known player should never be treated as a mob.
  if (S.players[name]) return;
  // Case-INSENSITIVE name comparison: events carry each log line's original
  // casing ("Orc slaver" when it attacks, "orc slaver" when attacked), and a
  // case flip is the SAME mob — treating it as an id reuse reset the fight
  // window on nearly every event, shattering one continuous pull into
  // 1-second fragments. Only a genuinely different name means id reuse.
  if (name[0] === name[0].toLowerCase()) lowercaseNames.add(name.toLowerCase());
  const sameName = (a, b) => a.toLowerCase() === b.toLowerCase();
  // Prefer the mid-sentence (lowercase) form for display, matching the client.
  const preferName = (oldN, newN) =>
    (oldN !== newN && newN[0] === newN[0].toLowerCase()) ? newN : oldN;
  if (!S.mobs[mob]) {
    S.mobs[mob] = { name, firstTs: ts, lastTs: ts, dead: false };
  } else if (!sameName(S.mobs[mob].name, name)) {
    // Mob ID reused after a combat reset — start a fresh entry.
    S.mobs[mob] = { name, firstTs: ts, lastTs: ts, dead: false };
  } else {
    S.mobs[mob].name = preferName(S.mobs[mob].name, name);
    S.mobs[mob].lastTs = ts;
  }
  if (!allMobsEver[mob]) {
    allMobsEver[mob] = { name, firstTs: ts, lastTs: ts };
    allMobOrderEver.push(mob);
  } else if (!sameName(allMobsEver[mob].name, name)) {
    // Mob ID reused after a combat reset — update the registry with fresh
    // timestamps and the new name, but keep the existing position in
    // allMobOrderEver.  Reordering allMobOrderEver on each seek causes the
    // list to scramble: partial replays encounter IDs whose allMobsEver name
    // was recorded during a later seek, triggering false name-change moves.
    allMobsEver[mob] = { name, firstTs: ts, lastTs: ts };
  } else {
    allMobsEver[mob].name = preferName(allMobsEver[mob].name, name);
    if (ts > allMobsEver[mob].lastTs) allMobsEver[mob].lastTs = ts;
    if (ts < allMobsEver[mob].firstTs) allMobsEver[mob].firstTs = ts;
  }
}
function bumpTs(ts) {
  if (ts > S.lastTs) S.lastTs = ts;
  if (!S.fightStartTs) S.fightStartTs = ts;
  // When a session is selected, logFirstTs is pinned to SESSION_LOG_TS.
  // Don't let catch-up batches (which predate the session) pull it back.
  if (SESSION_LOG_TS <= 0 && (!logFirstTs || ts < logFirstTs)) logFirstTs = ts;
  if (!logLastTs  || ts > logLastTs)  logLastTs  = ts;
}

function resetState() {
  // /who class data outlives seeks — preserve it just as the server preserves
  // player_classes across combat resets in CombatState.
  const savedClasses = {};
  for (const [name, p] of Object.entries(S.players)) {
    if (p.classes && p.classes.length) savedClasses[name] = { cls: p.cls, classes: p.classes };
  }
  S.players   = {};
  S.mobs      = {};
  S.mobDmg    = {};
  S.mobTank   = {};
  S.mobHeal   = {};
  S.mobHealee = {};
  S.avoidance  = {};
  S.mobAvoid   = {};
  S.mobDmgTL    = {};
  S.mobTankTL   = {};
  S.mobHealTL   = {};
  S.mobHealedTL = {};
  S.mobAvoidTL  = {};
  S.fightStartTs = null;
  S.lastTs    = 0;
  S.casts     = {};
  S.mobLoot   = {};
  S.sessionCoin = 0;
  S.sessionSold = 0;
  S.lootOrder = [];
  S.lootOrderSet = new Set();
  S.lootTimes = [];
  S.heartbeats = [];
  for (const k of Object.keys(allMobLootEver)) delete allMobLootEver[k];
  selectedMob = null;
  lastData    = null;
  for (const [name, info] of Object.entries(savedClasses)) {
    const p = player(name);
    p.cls = info.cls;
    p.classes = info.classes;
  }
}

function applyEvent(ev) {
  // Loot actions mark pull boundaries: you tab to the next mob of the same
  // pull without looting; you loot corpses between pulls.
  if (ev.ts && (ev.k === 'currency_loot' || ev.k === 'item_loot' || ev.k === 'item_sell'
      || ev.k === 'item_hoard' || ev.k === 'item_enhance')) {
    S.lootTimes.push(ev.ts);
  }
  switch (ev.k) {
    case 'melee': {
      bumpTs(ev.ts);
      trackMob(ev.mob, ev.tank ? ev.src : ev.tgt, ev.ts);
      if (!ev.tank) {
        const p = player(ev.src);
        p.dmg += ev.dmg;
        p.dmgByType[ev.typ] = (p.dmgByType[ev.typ]||0) + ev.dmg;
        const mp = mobDmgPlayer(ev.mob, ev.src);
        mp.dmg += ev.dmg;
        mp.dmgByType[ev.typ] = (mp.dmgByType[ev.typ]||0) + ev.dmg;
        tlEntry(S.mobDmgTL, ev.mob, ev.src).push({ts: ev.ts, v: ev.dmg});
      } else {
        const mt = mobTankPlayer(ev.mob, ev.tgt);
        mt.dmg += ev.dmg;
        mt.dmgByType[ev.typ] = (mt.dmgByType[ev.typ]||0) + ev.dmg;
        tlEntry(S.mobTankTL, ev.mob, ev.tgt).push({ts: ev.ts, v: ev.dmg});
      }
      break;
    }
    case 'spell': {
      bumpTs(ev.ts);
      trackMob(ev.mob, ev.tank ? ev.src : ev.tgt, ev.ts);
      if (!ev.tank) {
        const p = player(ev.src);
        p.dmg += ev.dmg;
        p.dmgBySpell[ev.sp] = (p.dmgBySpell[ev.sp]||0) + ev.dmg;
        const mp = mobDmgPlayer(ev.mob, ev.src);
        mp.dmg += ev.dmg;
        mp.dmgBySpell[ev.sp] = (mp.dmgBySpell[ev.sp]||0) + ev.dmg;
        tlEntry(S.mobDmgTL, ev.mob, ev.src).push({ts: ev.ts, v: ev.dmg});
      } else {
        const mt = mobTankPlayer(ev.mob, ev.tgt);
        mt.dmg += ev.dmg;
        mt.dmgByType['hit'] = (mt.dmgByType['hit']||0) + ev.dmg;
        tlEntry(S.mobTankTL, ev.mob, ev.tgt).push({ts: ev.ts, v: ev.dmg});
      }
      break;
    }
    case 'dot': {
      bumpTs(ev.ts);
      trackMob(ev.mob, ev.tgt, ev.ts);
      const p = player(ev.src);
      p.dmg += ev.dmg;
      p.dmgByType['dot'] = (p.dmgByType['dot']||0) + ev.dmg;
      p.dmgBySpell[ev.sp] = (p.dmgBySpell[ev.sp]||0) + ev.dmg;
      const mp = mobDmgPlayer(ev.mob, ev.src);
      mp.dmg += ev.dmg;
      mp.dmgByType['dot'] = (mp.dmgByType['dot']||0) + ev.dmg;
      mp.dmgBySpell[ev.sp] = (mp.dmgBySpell[ev.sp]||0) + ev.dmg;
      tlEntry(S.mobDmgTL, ev.mob, ev.src).push({ts: ev.ts, v: ev.dmg});
      break;
    }
    case 'rip': {
      bumpTs(ev.ts);
      trackMob(ev.mob, ev.tgt, ev.ts);
      const p = player(ev.src);
      p.dmg += ev.dmg;
      p.dmgByType['riposte'] = (p.dmgByType['riposte']||0) + ev.dmg;
      const mp = mobDmgPlayer(ev.mob, ev.src);
      mp.dmg += ev.dmg;
      mp.dmgByType['riposte'] = (mp.dmgByType['riposte']||0) + ev.dmg;
      tlEntry(S.mobDmgTL, ev.mob, ev.src).push({ts: ev.ts, v: ev.dmg});
      break;
    }
    case 'ds': {
      bumpTs(ev.ts);
      trackMob(ev.mob, ev.tgt, ev.ts);
      const p = player(ev.src);
      p.dmg += ev.dmg;
      p.dmgByType['ds'] = (p.dmgByType['ds']||0) + ev.dmg;
      const mp = mobDmgPlayer(ev.mob, ev.src);
      mp.dmg += ev.dmg;
      mp.dmgByType['ds'] = (mp.dmgByType['ds']||0) + ev.dmg;
      tlEntry(S.mobDmgTL, ev.mob, ev.src).push({ts: ev.ts, v: ev.dmg});
      break;
    }
    case 'heal': {
      bumpTs(ev.ts);
      const src = player(ev.src);
      src.heals += ev.amt;
      src.healsBySpell[ev.sp] = (src.healsBySpell[ev.sp]||0) + ev.amt;
      const tgt = player(ev.tgt);
      tgt.healed += ev.amt;
      tgt.healedBySpell[ev.sp] = (tgt.healedBySpell[ev.sp]||0) + ev.amt;
      if (ev.mob != null) {
        const mh = mobHealPlayer(ev.mob, ev.src);
        mh.heals += ev.amt;
        mh.healsBySpell[ev.sp] = (mh.healsBySpell[ev.sp]||0) + ev.amt;
        const mhe = mobHealeePlayer(ev.mob, ev.tgt);
        mhe.healed += ev.amt;
        mhe.healedBySpell[ev.sp] = (mhe.healedBySpell[ev.sp]||0) + ev.amt;
        tlEntry(S.mobHealTL,   ev.mob, ev.src).push({ts: ev.ts, v: ev.amt});
        tlEntry(S.mobHealedTL, ev.mob, ev.tgt).push({ts: ev.ts, v: ev.amt});
      }
      break;
    }
    case 'hb': {
      // Combat heartbeat: the player is stunned/OOM/interrupted — combat is
      // ongoing even though no mob is named (they may all be on a merc or
      // tank whose lines never reach this log). Bridges encounter gaps.
      S.heartbeats.push(ev.ts);
      break;
    }
    case 'cc': {
      // Crowd control: parked mobs are deliberately idle — suspend their
      // idle-timeout and hold their encounter open until they wake.
      bumpTs(ev.ts);
      trackMob(ev.mob, ev.tgt, ev.ts);
      if (S.mobs[ev.mob]) S.mobs[ev.mob].parked = !ev.off;
      break;
    }
    case 'slay': {
      bumpTs(ev.ts);
      if (S.mobs[ev.mob]) S.mobs[ev.mob].dead = true;
      break;
    }
    case 'miss': {
      bumpTs(ev.ts);
      // Only count player avoidance: src must be the mob (mob attacking player).
      // When a player attacks a mob and the mob dodges, src=player, tgt=mob — skip those.
      if (S.mobs[ev.mob]?.name !== ev.src) break;
      if (!S.avoidance[ev.tgt]) S.avoidance[ev.tgt] = { total:0, byType:{} };
      S.avoidance[ev.tgt].total++;
      S.avoidance[ev.tgt].byType[ev.typ] = (S.avoidance[ev.tgt].byType[ev.typ]||0) + 1;
      const ma = mobAvoidPlayer(ev.mob, ev.tgt);
      ma.total++;
      ma.byType[ev.typ] = (ma.byType[ev.typ]||0) + 1;
      tlEntry(S.mobAvoidTL, ev.mob, ev.tgt).push({ts: ev.ts, v: 1});
      break;
    }
    case 'absorb': {
      bumpTs(ev.ts);
      if (!S.avoidance[ev.tgt]) S.avoidance[ev.tgt] = { total:0, byType:{} };
      S.avoidance[ev.tgt].total++;
      S.avoidance[ev.tgt].byType['absorb'] = (S.avoidance[ev.tgt].byType['absorb']||0) + 1;
      const ab = mobAvoidPlayer(ev.mob, ev.tgt);
      ab.total++;
      ab.byType['absorb'] = (ab.byType['absorb']||0) + 1;
      tlEntry(S.mobAvoidTL, ev.mob, ev.tgt).push({ts: ev.ts, v: 1});
      break;
    }
    case 'cast': {
      S.casts[ev.src] = { spell: ev.sp, logTs: ev.ts };
      break;
    }
    case 'who': {
      const p = player(ev.name);
      p.classes = ev.classes || [];
      p.cls = p.classes[0] || '';
      p.level = ev.level || 0;
      break;
    }
    case 'currency_loot': {
      bumpTs(ev.ts);
      mobLootEntry(ev.mob).copper += ev.copper;
      S.sessionCoin += ev.copper;
      applyLootToGlobal(ev);
      break;
    }
    case 'item_loot': {
      bumpTs(ev.ts);
      mobLootEntry(ev.mob).items.push({ item: ev.item, qty: ev.qty, d: 'kept', copper: 0 });
      applyLootToGlobal(ev);
      break;
    }
    case 'item_sell': {
      bumpTs(ev.ts);
      mobLootEntry(ev.mob).items.push({ item: ev.item, qty: ev.qty, d: 'sold', copper: ev.copper });
      S.sessionSold += ev.copper;
      applyLootToGlobal(ev);
      break;
    }
    case 'item_hoard': {
      bumpTs(ev.ts);
      mobLootEntry(ev.mob).items.push({ item: ev.item, qty: 1, d: 'hoard', copper: 0 });
      applyLootToGlobal(ev);
      break;
    }
    case 'item_enhance': {
      bumpTs(ev.ts);
      mobLootEntry(ev.mob).items.push({ item: ev.item, qty: 1, d: 'enhance', copper: 0 });
      applyLootToGlobal(ev);
      break;
    }
  }
}

function applyBatch(batch) {
  for (const ev of batch.events) applyEvent(ev);
  lastBatchWallTimeSecs = Date.now() / 1000;
}

// ── Build the render-ready state snapshot from S ──────────────────────────────
function buildRenderState() {
  // EQ log timestamps are stored as "fake UTC" (local time treated as UTC),
  // so we cannot compare them directly to Date.now().  Instead, use S.lastTs
  // as the log-time origin and advance it by however much real wall-clock time
  // has elapsed since the last batch arrived.  This keeps everything in the
  // same fake-UTC coordinate system and correctly ages out mobs after combat stops.
  const wallElapsed = lastBatchWallTimeSecs > 0 ? Math.max(0, Date.now() / 1000 - lastBatchWallTimeSecs) : 0;
  const nowSecs = (S.lastTs || 0) + wallElapsed;

  // Use log-based timestamps for all duration calculations so that replayed
  // historical logs and live logs both produce correct elapsed times.
  // (S.lastTs - S.fightStartTs) is the span of recorded activity, not wall-clock age.
  const elapsed = (S.fightStartTs && S.lastTs > S.fightStartTs)
    ? Math.max(S.lastTs - S.fightStartTs, 0.001)
    : 0.001;

  // Per-mob fight duration: from first combat event for that mob to last
  // (or to the most recent log event if still active).
  function getMobElapsed(mob) {
    if (!mob || !mob.firstTs) return elapsed;
    // EQ log timestamps have 1-second resolution; clamp to 1s minimum so
    // per-second rates stay finite when firstTs === lastTs (same log second).
    return Math.max(mob.lastTs - mob.firstTs, 1);
  }

  function dmgEntries(byPlayer, elapsedSecs) {
    const el = elapsedSecs || elapsed;
    return Object.entries(byPlayer)
      .sort((a,b) => b[1].dmg - a[1].dmg)
      .map(([name, p]) => {
        const sp = S.players[name] || {};
        return {
          name,
          class:   sp.cls     || p.cls     || '',
          classes: sp.classes || p.classes || [],
          level:   sp.level   || p.level   || 0,
          total_damage: p.dmg,
          dps: Math.round(p.dmg / el),
          damage_by_type: Object.entries(p.dmgByType||{})
            .sort((a,b)=>b[1]-a[1])
            .map(([type,damage])=>({ type, damage, dps: Math.round(damage/el) })),
          spells: Object.entries(p.dmgBySpell||{})
            .sort((a,b)=>b[1]-a[1])
            .map(([spell,damage])=>({ spell, damage, dps: Math.round(damage/el) })),
        };
      });
  }
  function tankEntries(byPlayer, elapsedSecs) {
    const el = elapsedSecs || elapsed;
    return Object.entries(byPlayer)
      .filter(([name]) => S.players[name] || isPetName(name))
      .sort((a,b) => b[1].dmg - a[1].dmg)
      .map(([name, p]) => {
        const sp = S.players[name] || {};
        return {
          name,
          class:   sp.cls     || p.cls     || '',
          classes: sp.classes || p.classes || [],
          total_damage: p.dmg,
          dps: Math.round(p.dmg / el),
          damage_by_type: Object.entries(p.dmgByType||{})
            .sort((a,b)=>b[1]-a[1])
            .map(([type,damage])=>({ type, damage, dps: Math.round(damage/el) })),
        };
      });
  }

  // Global per-player entities (damage dealers) — pass full player objects so dmgEntries
  // can pick up cls/classes directly without the S.players lookup fallback being needed.
  const entities = dmgEntries(
    Object.fromEntries(Object.entries(S.players).filter(([,p])=>p.dmg>0))
  );

  // Healers
  const healers = Object.entries(S.players)
    .filter(([,p])=>p.heals>0)
    .sort((a,b)=>b[1].heals-a[1].heals)
    .map(([name,p])=>({
      name, class:p.cls||'', classes:p.classes||[],
      total_heals: p.heals,
      hps: Math.round(p.heals/elapsed),
      heals_by_spell: Object.entries(p.healsBySpell||{})
        .sort((a,b)=>b[1]-a[1])
        .map(([spell,healed])=>({ spell, healed, hps: Math.round(healed/elapsed) })),
    }));

  // Healees
  const healees = Object.entries(S.players)
    .filter(([,p])=>p.healed>0)
    .sort((a,b)=>b[1].healed-a[1].healed)
    .map(([name,p])=>({
      name, class:p.cls||'', classes:p.classes||[],
      total_healed_received: p.healed,
      hps: Math.round(p.healed/elapsed),
      healed_received_by_spell: Object.entries(p.healedBySpell||{})
        .sort((a,b)=>b[1]-a[1])
        .map(([spell,healed])=>({ spell, healed, hps: Math.round(healed/elapsed) })),
    }));

  // Mob list — built from the persistent registry so it never shrinks when the
  // user seeks backwards.  Activity/death status comes from S.mobs (current
  // seek position); mobs outside the window are shown as inactive.
  // Rendered newest-first so live mobs pop in at the top.
  const mob_list = [...allMobOrderEver].reverse().map(id => {
    const current = S.mobs[id];
    const name = current ? current.name : allMobsEver[id].name;
    if (current) {
      const lastSeenAgo = Math.max(0, nowSecs - current.lastTs);
      // A parked (mezzed) mob is deliberately idle: no 15 s timeout while
      // parked, with a 5-minute ceiling for silent wear-off (max mez duration
      // is well under that; past it the group clearly walked away).
      const parked = !!current.parked && !current.dead && lastSeenAgo < 300;
      const isDead  = current.dead || (!parked && lastSeenAgo >= 15);
      const isActive = !isDead && !parked && lastSeenAgo < 5;
      const ever = allMobsEver[id];
      const fightSecs = (ever && ever.firstTs && ever.lastTs && ever.lastTs > ever.firstTs)
        ? ever.lastTs - ever.firstTs : getMobElapsed(current);
      return { id:+id, name, last_seen_secs: fightSecs, is_dead:isDead, is_active:isActive, is_parked: parked, first_ts: current.firstTs, last_ts: current.lastTs };
    } else {
      const ever = allMobsEver[id];
      const fightSecs = (ever.firstTs && ever.lastTs && ever.lastTs > ever.firstTs)
        ? ever.lastTs - ever.firstTs : 0;
      return { id:+id, name, last_seen_secs: fightSecs, is_dead: true, is_active: false, first_ts: ever.firstTs || null, last_ts: ever.lastTs || null };
    }
  });

  // Per-mob breakdowns — each mob uses its own fight duration for rates.
  const mob_damage  = Object.fromEntries(Object.entries(S.mobDmg).map(([id,bp])=>{
    const mobEl = getMobElapsed(S.mobs[+id]);
    return [id, dmgEntries(bp, mobEl)];
  }));
  const mob_tanking = Object.fromEntries(Object.entries(S.mobTank).map(([id,bp])=>{
    const mobEl = getMobElapsed(S.mobs[+id]);
    return [id, tankEntries(bp, mobEl)];
  }));
  const mob_healing = Object.fromEntries(Object.entries(S.mobHeal).map(([id,bh])=>{
    const mobEl = getMobElapsed(S.mobs[+id]);
    return [id, Object.entries(bh).sort((a,b)=>b[1].heals-a[1].heals).map(([name,h])=>{
      const sp = S.players[name] || {};
      return { name, class:sp.cls||'', classes:sp.classes||[], total_heals:h.heals, hps:Math.round(h.heals/mobEl),
        heals_by_spell: Object.entries(h.healsBySpell||{}).sort((a,b)=>b[1]-a[1])
          .map(([spell,healed])=>({ spell, healed, hps:Math.round(healed/mobEl) })),
      };
    })];
  }));
  const mob_healed = Object.fromEntries(Object.entries(S.mobHealee).map(([id,bh])=>{
    const mobEl = getMobElapsed(S.mobs[+id]);
    return [id, Object.entries(bh).sort((a,b)=>b[1].healed-a[1].healed).map(([name,h])=>{
      const sp = S.players[name] || {};
      return { name, class:sp.cls||'', classes:sp.classes||[], total_healed_received:h.healed, hps:Math.round(h.healed/mobEl),
        healed_received_by_spell: Object.entries(h.healedBySpell||{}).sort((a,b)=>b[1]-a[1])
          .map(([spell,healed])=>({ spell, healed, hps:Math.round(healed/mobEl) })),
      };
    })];
  }));

  // Global tanked (aggregate across all mobs)
  const tankedRaw = {};
  for (const byPlayer of Object.values(S.mobTank)) {
    for (const [name, p] of Object.entries(byPlayer)) {
      if (!S.players[name] && !isPetName(name)) continue;
      if (!tankedRaw[name]) tankedRaw[name] = { dmg:0, dmgByType:{} };
      tankedRaw[name].dmg += p.dmg;
      for (const [t,d] of Object.entries(p.dmgByType||{}))
        tankedRaw[name].dmgByType[t] = (tankedRaw[name].dmgByType[t]||0) + d;
    }
  }
  const tanked = tankEntries(tankedRaw);

  // Global avoidance (sorted by total count; class pulled from S.players if known)
  const avoidance = Object.entries(S.avoidance)
    .filter(([name]) => S.players[name] || isPetName(name))
    .sort((a, b) => b[1].total - a[1].total)
    .map(([name, av]) => {
      const sp = S.players[name] || {};
      return {
        name, class: sp.cls||'', classes: sp.classes||[], level: sp.level||0,
        total: av.total,
        by_type: Object.entries(av.byType).sort((a,b)=>b[1]-a[1]).map(([type,count])=>({type,count})),
      };
    });

  // Per-mob avoidance
  const mob_avoid = Object.fromEntries(Object.entries(S.mobAvoid).map(([id, byPlayer]) => [
    id,
    Object.entries(byPlayer).filter(([name])=>S.players[name]||isPetName(name)).sort((a,b)=>b[1].total-a[1].total).map(([name,av])=>{
      const sp = S.players[name] || {};
      return {
        name, class: sp.cls||'', classes: sp.classes||[], level: sp.level||0,
        total: av.total,
        by_type: Object.entries(av.byType).sort((a,b)=>b[1]-a[1]).map(([type,count])=>({type,count})),
      };
    }),
  ]));

  // Encounters (pulls): chain mob instances whose activity windows overlap or
  // follow within ENC_GAP seconds of log time. A fully-dead pull followed by
  // a fresh mob starts a NEW encounter even inside the gap, so chain pulls
  // slice at the corpse boundary. Combined damage/duration per encounter is
  // exact even when same-named concurrent mobs pool their per-individual
  // attribution (the log carries no individual identity).
  const ENC_GAP = 15;
  // Corpse-boundary rule: a fully-dead pull ends when LOOTING starts — you
  // tab to the next mob of the same pull without looting, and loot corpses
  // between pulls. Killing part of a pull while unengaged adds are silent
  // (EQ only logs YOUR combat — an add beating on the tank writes nothing to
  // your log) must NOT split the pull, so without a loot signal the ordinary
  // idle gap is the only cut.
  const lootBetween = (a, b) => S.lootTimes.some(t => t > a && t <= b);
  // Walk heartbeats forward from an encounter's end: each stun/OOM line
  // within the gap proves combat continued, extending the effective window.
  const hbExtend = (end) => {
    let e = end;
    for (const t of S.heartbeats) {
      if (t > e && t <= e + ENC_GAP) e = t;
    }
    return e;
  };
  const chrono = mob_list
    .filter(m => m.first_ts)
    .sort((a, b) => a.first_ts - b.first_ts || a.id - b.id);
  const encounters = [];
  let curEnc = null;
  for (const m of chrono) {
    const joins = curEnc
      && m.first_ts <= hbExtend(curEnc.end_ts) + ENC_GAP
      && !(curEnc.all_dead && lootBetween(curEnc.end_ts, m.first_ts));
    if (!joins) {
      curEnc = {
        key: m.first_ts, num: encounters.length + 1,
        start_ts: m.first_ts, end_ts: m.last_ts || m.first_ts,
        members: [], names: {}, all_dead: true, any_active: false,
      };
      encounters.push(curEnc);
    }
    curEnc.members.push(m.id);
    curEnc.end_ts = Math.max(curEnc.end_ts, m.last_ts || m.first_ts);
    curEnc.all_dead = curEnc.all_dead && m.is_dead;
    curEnc.any_active = curEnc.any_active || m.is_active;
    // NAMED detection: a capitalized proper-noun member (never seen
    // lowercase) marks this as a named encounter, vs trash; adds
    // ("Marrowbane pet") don't override the named itself.
    if (!curEnc.named && isNamedMob(m.name) && !m.name.endsWith(' pet')) curEnc.named = m.name;
    const nk = m.name.toLowerCase();
    curEnc.names[nk] = (curEnc.names[nk] || 0) + 1;
  }

  // fight_elapsed_secs: scope to the selected encounter or mob so the header
  // label and card rates cover the pull's / mob's own fight window.
  const selEnc = selectedEnc !== null ? encounters.find(e => e.key === selectedEnc) : null;
  const fight_elapsed_secs = selEnc
    ? Math.max(selEnc.end_ts - selEnc.start_ts, 1)
    : (selectedMob !== null && S.mobs[selectedMob])
      ? getMobElapsed(S.mobs[selectedMob])
      : elapsed;

  // Fight start display
  const fightStartDisplay = S.fightStartTs
    ? new Date(S.fightStartTs * 1000).toLocaleString('en-US') : '';

  // Last log time
  const lastLogTime = S.lastTs
    ? new Date(S.lastTs*1000).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
    : '';

  // Active casts — only show spells cast within the last 10 log-seconds of the
  // current replay position (S.lastTs).  This suppresses historical casts that
  // appear during initial load or after a seek to a later position.
  const casting = {};
  for (const [name, c] of Object.entries(S.casts))
    if (S.lastTs - c.logTs <= 10) casting[name] = { spell: c.spell };

  return {
    entities, healers, healees,
    mob_list, encounters, now_secs: nowSecs,
    mob_damage, mob_tanking, mob_healing, mob_healed, tanked,
    avoidance, mob_avoid,
    fight_start_display: fightStartDisplay,
    fight_elapsed_secs,
    last_log_time: lastLogTime,
    casting,
  };
}

// Wall-clock time (seconds) when the most recent batch was applied.
// Used to advance "nowSecs" between batches without depending on client timezone.
let lastBatchWallTimeSecs = 0;

// ── UI state ──────────────────────────────────────────────────────────────────
let selectedMob      = null;
let selectedEnc      = null;   // encounter key (start_ts) — pull-level scoping
let encManuallySelected = false; // true only for a user click (not live auto-follow)
let tlEncScope       = null;   // {start, end}: timeline bar scoped to a selected pull
let pendingMobRestore = null;  // mob id to re-select after a seek reset, if still in window
let liveAutoSelect   = true;   // auto-select most recent active mob in live mode; disabled by manual pick, re-enabled by Go Live
let detailMode   = 'damage';
let lastData     = null;
let graphVisible    = false;
let chartInst       = null;
let chartInstRate   = null;

function selectEnc(key) {
  if (tlIsLive) liveAutoSelect = false;
  pendingMobRestore = null;
  selectedEnc = key;
  selectedMob = null;
  encManuallySelected = key !== null;
  // Scope the timeline bar to this pull's window (small pad past the end).
  tlEncScope = null;
  if (key !== null && lastData) {
    const enc = (lastData.encounters || []).find(e => e.key === key);
    if (enc && enc.end_ts > enc.start_ts) tlEncScope = { start: enc.start_ts, end: enc.end_ts + 5 };
  }
  if (key !== null) detailMode = 'damage';
  history.replaceState(null, '', key !== null ? '#enc-' + key : location.pathname + location.search);
  if (lastData) { lastData = buildRenderState(); rerender(); }
  updateTimelineBar();
}

/// Pull index dropdown above the mob list: jump straight to an encounter.
function encSelectChanged(value) {
  if (value) {
    selectEnc(+value);
    const row = document.querySelector(`.enc-row[data-enc-key="${value}"]`);
    if (row) row.scrollIntoView({ block: 'start' });
  } else {
    deselectMob();
  }
}

/// ⟲ on a selected pull: replay it from its first event at the chosen speed.
function replayEncounter(key) {
  const enc = lastData ? (lastData.encounters || []).find(e => e.key === key) : null;
  if (!enc) return;
  if (tlIsLive) liveAutoSelect = false;
  encManuallySelected = true;
  tlEncScope = { start: enc.start_ts, end: enc.end_ts + 5 };
  if (tlPaused) { tlPaused = false; updatePlayPauseBtn(); }
  seekToLogTs(enc.start_ts);
  updateTimelineBar();
}

function selectMob(id) {
  if (tlIsLive) liveAutoSelect = false;
  pendingMobRestore = null;
  selectedEnc = null;
  encManuallySelected = false;
  tlEncScope = null;
  updateTimelineBar();

  selectedMob = id;
  history.replaceState(null, '', id !== null ? '#mob-' + id : location.pathname + location.search);
  if (selectedMob !== null) detailMode = 'damage';
  // Rebuild state so fight_elapsed_secs reflects the newly-selected mob,
  // not the stale global elapsed from the previous render.
  if (lastData) { lastData = buildRenderState(); rerender(); }

  if (id !== null) {
    const mob = S.mobs[id];
    if (mob) {
      // Always seek to the end of the mob's known history.
      const targetTs = mob.lastTs || mob.firstTs;
      if (targetTs) {
        pendingMobRestore = id;
        seekToLogTs(targetTs);
      }
    } else {
      // Mob not in current seek window — use persistent registry to seek to its last appearance.
      const ever = allMobsEver[id];
      if (ever && ever.lastTs) {
        pendingMobRestore = id;
        seekToLogTs(ever.lastTs);
      }
    }
  }
}
function restartMobFight(mobId) {
  if (tlIsLive) liveAutoSelect = false;
  const mob = S.mobs[mobId];
  const ever = allMobsEver[mobId];
  const firstTs = (mob && mob.firstTs) || (ever && ever.firstTs);
  if (firstTs) {
    if (tlPaused) { tlPaused = false; updatePlayPauseBtn(); }
    pendingMobRestore = mobId;
    seekToLogTs(firstTs);
  }
}
function deselectMob() {
  if (tlIsLive) liveAutoSelect = false;
  pendingMobRestore = null;
  if (selectedMob !== null || selectedEnc !== null) {
    selectedMob = null;
    selectedEnc = null;
    encManuallySelected = false;
    tlEncScope = null;
    history.replaceState(null, '', location.pathname + location.search);
    if (lastData) { lastData = buildRenderState(); rerender(); }
    updateTimelineBar();
  }
}
function setMode(mode) { detailMode = mode; if (lastData) rerender(); }

// ── Debounced render ──────────────────────────────────────────────────────────
// During journal catch-up the browser receives many batches in rapid succession.
// We defer rendering to the next animation frame so we only paint once after
// the burst settles, rather than for every batch.
let renderScheduled = false;
function scheduleRender() {
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => {
    renderScheduled = false;
    // Restore pending mob BEFORE building state so fight_elapsed_secs is
    // computed with the correct mob, not the stale global elapsed.
    if (selectedMob === null && pendingMobRestore !== null && S.mobs[pendingMobRestore]) {
      selectedMob = pendingMobRestore;
      pendingMobRestore = null;
    }
    lastData = buildRenderState();
    // Fallback: mob visible in mob_list but not yet in S.mobs.
    if (selectedMob === null && pendingMobRestore !== null) {
      if ((lastData.mob_list || []).some(m => m.id === pendingMobRestore)) {
        selectedMob = pendingMobRestore;
        pendingMobRestore = null;
      }
    }
    if (tlIsLive && liveAutoSelect) {
      // Follow the current PULL: newest encounter with a living member.
      // Combined damage/DPS over the encounter's whole life — fighting five
      // mobs as a unit reports as a unit. Clicking a mob still narrows to it.
      const encs = lastData.encounters || [];
      // Current pull, or — between fights — the most recent one, so the
      // header always shows an encounter while live.
      const liveEnc = [...encs].reverse().find(e => !e.all_dead) || encs[encs.length - 1];
      const targetKey = liveEnc ? liveEnc.key : null;
      if (targetKey !== selectedEnc) {
        selectedEnc = targetKey;
        selectedMob = null;
        lastData = buildRenderState(); // recompute fight_elapsed for the new scope
      }
    }
    updateLogClock(lastData);
    rerender();
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function buildFightLabel(d) {
  const el = document.getElementById('fight-label');

  // Encounter (pull) selected: combined stats over the pull's whole life.
  if (selectedEnc !== null) {
    const enc = (d.encounters || []).find(e => e.key === selectedEnc);
    if (enc) {
      // Title matches the pull list — the named (true casing) or "Pull #N";
      // the composition rides along as a small subtitle.
      const title = enc.named ? `★ ${enc.named}` : `Pull #${enc.num}`;
      const comp = Object.entries(enc.names)
        .sort((a, b) => b[1] - a[1])
        .map(([n, c]) => c > 1 ? `${n} ×${c}` : n)
        .join(', ');
      const accent = enc.any_active && tlIsLive ? '#3cdc3c' : enc.all_dead ? '#464646' : '#c8aa1e';
      el.style.borderLeftColor = accent;
      const totalDmg = enc.members.reduce((s, id) =>
        s + ((d.mob_damage || {})[String(id)] || []).reduce((t, e) => t + (e.total_damage || 0), 0), 0);
      // An active pull's clock runs: duration (and therefore DPS) ticks with
      // "now" until everything is dead, then freezes at the recorded span.
      const encRunning = tlIsLive && !enc.all_dead && d.now_secs;
      const encSecs = encRunning
        ? Math.max(d.now_secs - enc.start_ts, 1)
        : Math.max(enc.end_ts - enc.start_ts, 1);
      const blocks = [
        `<div class="fl-stat-block"><span class="fl-stat-label">Mobs</span><span class="fl-totdmg">${enc.members.length}</span></div>`,
        totalDmg > 0 ? `<div class="fl-stat-block fl-stat-dmg"><span class="fl-stat-label">Damage</span><span class="fl-totdmg">${fmtK(totalDmg)}</span></div>` : '',
        totalDmg > 0 ? `<div class="fl-stat-block fl-stat-dps"><span class="fl-stat-label">DPS</span><span class="fl-totdmg">${fmtK(Math.round(totalDmg / encSecs))}</span></div>` : '',
        `<div class="fl-stat-block fl-stat-dur"><span class="fl-stat-label">Duration</span><span class="fl-secs">${fmtTime(encSecs)}</span></div>`,
        `<div class="fl-stat-block fl-stat-seen"><span class="fl-stat-label">Seen</span><span class="fl-seen">${fmtTsPos(enc.start_ts)}</span></div>`,
      ].join('');
      const replayBtn = `<span class="fl-restart" onclick="event.stopPropagation();replayEncounter(${enc.key})" title="Replay this pull from the beginning">&#8634;</span>`;
      el.innerHTML = `<div class="fl-name-wrap"><span class="fl-name">${truncate(title, 26)}</span>`
        + `<span class="fl-enc-comp">${truncate(comp, 48)}</span></div>`
        + `<div class="fl-stats">${blocks}${replayBtn}</div>`;
      return;
    }
  }

  if (selectedMob === null) {
    el.innerHTML = '<div class="fl-name-wrap"><span class="fl-name" style="font-size:13px;color:#555">No mob selected</span></div>';
    el.style.borderLeftColor = '#444';
    return;
  }
  const mobEntry = (d.mob_list || []).find(m => m.id === selectedMob);
  const mob = (mobEntry ? mobEntry.name : null) || '—';

  const accentColor = !mobEntry ? '#444'
    : mobEntry.is_dead                   ? '#464646'
    : (tlIsLive && mobEntry.is_active)   ? '#3cdc3c'
    :                                      '#c8aa1e';
  el.style.borderLeftColor = accentColor;

  const key = String(selectedMob);
  const totalMobDmg = ((d.mob_damage || {})[key] || []).reduce((s, e) => s + (e.total_damage || 0), 0);

  let statsHtml = '';
  if (mobEntry) {
    const enc = Math.round(d.fight_elapsed_secs || mobEntry.last_seen_secs);
    // Only show duration once we have at least two distinct log-seconds of data.
    const hasRealElapsed = mobEntry.first_ts && mobEntry.last_ts && mobEntry.last_ts > mobEntry.first_ts;

    const dmgBlock = totalMobDmg > 0
      ? `<div class="fl-stat-block fl-stat-dmg"><span class="fl-stat-label">Damage</span><span class="fl-totdmg">${fmtK(totalMobDmg)}</span></div>`
      : '';
    // Fight DPS: total damage to this mob over its own fight window — the
    // "current DPS" for a live fight (auto-selected mob) and the per-fight
    // DPS when reviewing a past encounter.
    const dpsBlock = (totalMobDmg > 0 && hasRealElapsed && enc > 0)
      ? `<div class="fl-stat-block fl-stat-dps"><span class="fl-stat-label">DPS</span><span class="fl-totdmg">${fmtK(Math.round(totalMobDmg / enc))}</span></div>`
      : '';
    const secsBlock = hasRealElapsed
      ? `<div class="fl-stat-block fl-stat-dur"><span class="fl-stat-label">Duration</span><span class="fl-secs">${fmtTime(enc)}</span></div>`
      : '';
    let seenBlock = '';
    if (mobEntry.first_ts) {
      const seenStart = fmtTsPos(mobEntry.first_ts);
      const seenVal = (mobEntry.is_dead && mobEntry.last_ts && mobEntry.last_ts !== mobEntry.first_ts)
        ? `${seenStart} → ${fmtTsPos(mobEntry.last_ts)}`
        : seenStart;
      seenBlock = `<div class="fl-stat-block fl-stat-seen"><span class="fl-stat-label">Seen</span><span class="fl-seen">${seenVal}</span></div>`;
    }
    const restartBtn = mobEntry.first_ts
      ? `<span class="fl-restart" onclick="event.stopPropagation();restartMobFight(${selectedMob})" title="Restart fight from beginning">&#8634;</span>`
      : '';
    statsHtml = `<div class="fl-stats">${dmgBlock}${dpsBlock}${secsBlock}${seenBlock}${restartBtn}</div>`;
  }

  const nameColor = accentColor === '#3cdc3c' ? '#3cdc3c' : '#f0a030';
  el.innerHTML = `<div class="fl-name-wrap"><span class="fl-name" style="color:${nameColor}">${mob}</span></div>${statsHtml}`;
}

function lootKillBlock(mob, entry, mobName) {
  const chips = entry.items.map(it => {
    const qty   = it.qty > 1 ? `×${it.qty} ` : '';
    const label = truncate(`${qty}${it.item}`, 22);
    let cls = 'loot-chip ';
    let title = it.item;
    if (it.d === 'sold')         { cls += 'loot-chip-sold';    title += ` (sold ${formatCopper(it.copper)})`; }
    else if (it.d === 'hoard')   { cls += 'loot-chip-hoard';   }
    else if (it.d === 'enhance') { cls += 'loot-chip-enhance'; }
    else                         { cls += 'loot-chip-kept';    }
    return `<span class="${cls}" title="${title}">${label}</span>`;
  }).join('');
  if (!chips) return '';
  return `<div class="loot-kill">
    <div class="loot-kill-name">${truncate(mobName, 28)}</div>
    <div class="loot-kill-items">${chips}</div>
  </div>`;
}

function renderLootRows() {
  const playerName = document.getElementById('player-name').textContent;
  const hdr = `<div class="loot-player-hdr">${playerName || '—'}</div>`;

  if (selectedEnc !== null && lastData) {
    const enc = (lastData.encounters || []).find(e => e.key === selectedEnc);
    if (enc) {
      const blocks = enc.members.map(id => {
        const entry = allMobLootEver[id] || S.mobLoot[id];
        if (!entry || (!entry.copper && !entry.items.length)) return '';
        const mobName = (S.mobs[id]?.name) || (allMobsEver[id]?.name) || 'unknown';
        return lootKillBlock(id, entry, mobName) || '';
      }).filter(Boolean).join('');
      return hdr + (blocks || '<div class="loot-empty">No loot for this pull</div>');
    }
  }

  if (selectedMob !== null) {
    const entry   = allMobLootEver[selectedMob] || S.mobLoot[selectedMob] || { copper: 0, items: [] };
    const mobName = (S.mobs[selectedMob]?.name) || (allMobsEver[selectedMob]?.name) || 'unknown';
    const block   = lootKillBlock(selectedMob, entry, mobName);
    return hdr + (block || '<div class="loot-empty">No loot for this mob</div>');
  }

  const keptCount    = Object.values(S.mobLoot).reduce((n, e) => n + e.items.filter(i => i.d === 'kept' || i.d === 'hoard').length, 0);
  const soldCount    = Object.values(S.mobLoot).reduce((n, e) => n + e.items.filter(i => i.d === 'sold').length, 0);
  const enhanceCount = Object.values(S.mobLoot).reduce((n, e) => n + e.items.filter(i => i.d === 'enhance').length, 0);
  const coinParts = [];
  if (S.sessionCoin) coinParts.push(`Coin: <span class="ls-coin">${formatCopperShort(S.sessionCoin)}</span>`);
  if (S.sessionSold) coinParts.push(`Sold: <span class="ls-sold">${formatCopperShort(S.sessionSold)}</span>`);
  const itemParts = [];
  if (keptCount)    itemParts.push(`Kept: <span class="ls-kept">${keptCount}</span>`);
  if (soldCount)    itemParts.push(`Auto-sold: <span class="ls-autosold">${soldCount}</span>`);
  if (enhanceCount) itemParts.push(`Enhance: <span class="ls-enhance">${enhanceCount}</span>`);
  const summaryLines = [coinParts.join('  '), itemParts.join('  ')].filter(Boolean);
  const summary = summaryLines.length ? `<div class="loot-session-totals">${summaryLines.join('<br>')}</div>` : '';

  const order = [...S.lootOrder].reverse();
  if (!order.length) return hdr + summary + '<div class="loot-empty">No loot this session</div>';

  const chunks = order.map(mob => {
    const entry   = S.mobLoot[mob] || { copper: 0, items: [] };
    const mobName = (S.mobs[mob]?.name) || (allMobsEver[mob]?.name) || 'unknown';
    return lootKillBlock(mob, entry, mobName);
  }).filter(Boolean);

  return hdr + summary + chunks.join('');
}

function rerender() {
  if (!lastData) return;
  buildFightLabel(lastData);
  renderMobList(lastData);
  renderSummary(lastData);
  renderCards(lastData);
  if (graphVisible) renderGraph();
}

function renderMobList(d) {
  const scroller   = document.getElementById('mob-scroll');
  const container  = document.getElementById('mob-rows');
  const saved      = scroller.scrollTop;
  const mobs       = d.mob_list || [];

  // Pull index dropdown: rebuild only when the encounter set changes (a
  // rebuild while the dropdown is open would snap it shut), keep its value
  // in sync with the current selection.
  const encSel = document.getElementById('enc-select');
  if (encSel) {
    const encsAll = d.encounters || [];
    const sig = encsAll.length + ':' + encsAll.filter(e => e.named).length
      + ':' + (encsAll.length ? encsAll[encsAll.length - 1].key : 0);
    if (encSel.dataset.sig !== sig) {
      encSel.dataset.sig = sig;
      encSel.innerHTML = '<option value="">Mobs — all pulls</option>'
        + [...encsAll].reverse().map(e => {
            const t = new Date(e.start_ts * 1000)
              .toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            const label = e.named ? `★ ${e.named} · ${t}` : `Pull #${e.num} · ${t}`;
            return `<option value="${e.key}">${label}</option>`;
          }).join('');
    }
    const want = selectedEnc !== null ? String(selectedEnc) : '';
    if (encSel.value !== want) encSel.value = want;
  }

  // Build a map of existing DOM rows keyed by mob id string so we can reuse
  // them across renders.  Reusing nodes avoids tearing down elements that may
  // be mid-click, which previously caused clicks to land on the wrong mob.
  const existing = {};
  for (const row of container.querySelectorAll('.mob-row')) {
    existing[row.dataset.mobId] = row;
  }

  // Display sequence: encounter (pull) blocks newest-first, each header
  // followed by its member mobs newest-first; instances outside any
  // encounter (registry stubs with no timestamps) trail at the bottom.
  const byId = new Map(mobs.map(m => [m.id, m]));
  const inEnc = new Set();
  const items = [];
  const encs = (d.encounters || []);
  for (let e = encs.length - 1; e >= 0; e--) {
    const enc = encs[e];
    items.push({ type: 'enc', enc });
    for (let j = enc.members.length - 1; j >= 0; j--) {
      const m = byId.get(enc.members[j]);
      if (m) { items.push({ type: 'mob', m, member: true }); inEnc.add(m.id); }
    }
  }
  for (const m of mobs) {
    if (!inEnc.has(m.id)) items.push({ type: 'mob', m, member: false });
  }

  const seen = new Set();
  let domIdx = 0;
  for (const item of items) {
    if (item.type === 'enc') {
      const enc = item.enc;
      const idStr = 'e' + enc.key;
      seen.add(idStr);
      const startClock = new Date(enc.start_ts * 1000)
        .toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      const label = enc.named
        ? `★ ${enc.named} · ${startClock}`
        : `Pull #${enc.num} · ${startClock}`;
      const cls = 'enc-row'
        + (enc.named ? ' enc-named' : '')
        + (enc.any_active && tlIsLive ? ' enc-active' : '')
        + (selectedEnc === enc.key ? ' selected' : '');
      let row = existing[idStr];
      if (!row) {
        row = document.createElement('div');
        row.dataset.mobId = idStr;
        row.dataset.encKey = String(enc.key);
        row.addEventListener('click', function(e) { e.stopPropagation(); selectEnc(+this.dataset.encKey); });
        row.innerHTML = '<span class="enc-label"></span><span class="enc-count"></span>';
        row._label = row.children[0];
        row._count = row.children[1];
      }
      if (row.className !== cls) row.className = cls;
      const labelText = truncate(label, 24);
      const encDur = (tlIsLive && !enc.all_dead && d.now_secs)
        ? Math.max(d.now_secs - enc.start_ts, 1)
        : Math.max(enc.end_ts - enc.start_ts, 1);
      const countText = `${enc.members.length}× · ${fmtTime(encDur)}`;
      if (row._label.textContent !== labelText) row._label.textContent = labelText;
      if (row._count.textContent !== countText) row._count.textContent = countText;
      if (container.children[domIdx] !== row) container.insertBefore(row, container.children[domIdx] || null);
      domIdx++;
      continue;
    }

    const m       = item.m;
    const i       = domIdx;
    const idStr   = String(m.id);
    seen.add(idStr);

    const outside    = !m.first_ts && m.last_seen_secs === 0 && !m.is_dead && !m.is_active;
    const liveActive = tlIsLive && m.is_active;
    const parked     = m.is_parked && !m.is_dead;
    const dotColor   = outside ? '#333333' : m.is_dead ? '#464646' : parked ? '#6aa9ff' : liveActive ? '#3cdc3c' : '#c8aa1e';
    const nameColor  = outside ? '#444444' : m.is_dead ? '#5a5a5a' : parked ? '#9fc4ff' : liveActive ? '#ffffff' : '#a0a0a0';
    const statusCls  = outside || m.is_dead ? '' : liveActive ? ' mob-active' : ' mob-alive';
    const sel        = selectedMob === m.id ? ' selected' : '';
    const timeStr    = parked ? 'mez' : (m.last_seen_secs > 0 ? fmtTime(m.last_seen_secs) : '');
    const memberCls  = item.member ? ' enc-member' : '';
    const newCls     = `mob-row${statusCls}${sel}${memberCls}`;

    let row = existing[idStr];
    if (!row) {
      row = document.createElement('div');
      row.dataset.mobId = idStr;
      row.addEventListener('click', function(e) { e.stopPropagation(); selectMob(+this.dataset.mobId); });
      row.innerHTML = '<span class="mob-dot">●</span><span class="mob-name"></span><span class="mob-time"></span>';
      row._dot  = row.children[0];
      row._name = row.children[1];
      row._time = row.children[2];
    }

    if (row.className          !== newCls)   row.className          = newCls;
    if (row._dot.style.color   !== dotColor) row._dot.style.color   = dotColor;
    // Named (capitalized proper-noun) mobs render gold unless dead/outside.
    const finalNameColor = (!outside && !m.is_dead && isNamedMob(m.name)) ? '#e8c76a' : nameColor;
    if (row._name.style.color  !== finalNameColor) row._name.style.color = finalNameColor;
    const nameText = truncate(m.name, 18);
    if (row._name.textContent  !== nameText)  row._name.textContent = nameText;
    if (row._time.textContent  !== timeStr)   row._time.textContent = timeStr;

    // Move row to correct position only when needed to avoid layout thrash.
    if (container.children[i] !== row) container.insertBefore(row, container.children[i] || null);
    domIdx++;
  }

  // Remove rows for mobs that are no longer in the list.
  for (const [idStr, row] of Object.entries(existing)) {
    if (!seen.has(idStr)) row.remove();
  }

  scroller.scrollTop = saved;
}

function renderSummary(d) {
  const elapsed = Math.max(d.fight_elapsed_secs, 0.001);
  const hdrEl  = document.getElementById('sum-header-area');
  const rowsEl = document.getElementById('sum-rows');

  const TAB_LABELS = { damage:'Dmg', healing:'Healer', healed:'Healed', tanked:'Tank', avoid:'Avoid', loot:'Loot' };
  const tabs = ['damage','healing','healed','tanked','avoid','loot'].map(m => {
    const active = detailMode === m ? ' active' : '';
    return `<button class="mode-tab tab-${m}${active}" onclick="event.stopPropagation();setMode('${m}')">${TAB_LABELS[m]}</button>`;
  }).join('');
  hdrEl.innerHTML = `<div id="mode-tabs">${tabs}</div>`;

  if (detailMode === 'loot') {
    rowsEl.innerHTML = renderLootRows();
    return;
  }

  // Suppress per-second rates when we don't yet have reliable elapsed data
  // (mob has only been seen within a single log-second).
