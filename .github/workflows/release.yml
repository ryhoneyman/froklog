name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + Windows target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW cross-compiler
        run: sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build froklog.exe (tray client)
        run: cargo build --release --bin froklog --target x86_64-pc-windows-gnu --features tray

      - name: Build froklog-replay.exe
        run: cargo build --release --bin froklog-replay --target x86_64-pc-windows-gnu

      - name: Collect artifacts
        run: |
          mkdir dist
          cp target/x86_64-pc-windows-gnu/release/froklog.exe dist/
          cp target/x86_64-pc-windows-gnu/release/froklog-replay.exe dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/froklog.exe
            dist/froklog-replay.exe
          generate_release_notes: true
