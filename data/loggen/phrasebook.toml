# froklog NPC phrasebook
#
# Single source of truth for all NPC chat content.
# Lookup priority: (kind + archetype + register) → (kind + archetype) → (kind generic)
#
# Archetype values: QuietAnchor, ChaoticNarrator, RaidLeader, ReactiveObserver,
#                   TacticalFocused, Custom
# Register values:  Neutral, Elated, Frustrated, Tired, Engaged
#
# Slot syntax:     {slot_name}   — filled at emit time
# Fragment syntax: {$pool_name}  — randomly expanded from [fragments] below

# ── Fragment pools ────────────────────────────────────────────────────────────

[fragments]
wow        = ["lol", "lmao", "omg", "haha", "holy", "dude", "geez", "sheesh",
              "okay wow", "my dude", "yooo", "I mean", "okay okay", "seriously",
              "bruh", "not gonna lie", "I can't", "dead"]
easy       = ["ez", "easy", "clean", "stomp", "no contest", "like nothing",
              "absolute cleanup", "not even a sweat", "effortless",
              "over before it started"]
rough      = ["rough", "oof", "ouch", "yikes", "brutal", "messy",
              "painful", "not great", "that sucked", "ugly",
              "okay that was bad", "rip"]
hype       = ["let's go", "that's what I'm talking about", "we're cooking",
              "this is the run", "no stopping us now", "on a roll tonight",
              "absolutely sending it", "unstoppable", "in the zone",
              "best group I've been in", "peak performance"]
miss_jab   = ["can't buy a hit tonight", "hitting with their eyes closed",
              "swinging at ghosts", "forgot how combat works",
              "might as well be afk", "found a new way to miss",
              "hitting like a wet noodle", "apparently on a different server",
              "in invisible mode apparently", "allergic to hitting things",
              "has never heard of making contact", "is just vibing"]
carry      = ["carrying", "doing work", "cooking", "going off", "on fire right now",
              "absolutely cooking", "built different", "in their zone",
              "not messing around tonight", "going crazy"]
close      = ["close", "too close", "nearly", "almost", "right on the edge",
              "way too close for comfort", "millimeters from dying",
              "barely made it", "by a thread", "that was it"]

